<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Grid Work — командные Kanban-доски с проектами, Гантом и календарём. Grid Life — личный календарь задач, который работает без интернета.">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<title>Grid</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/grid-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600&display=swap">
<link rel="stylesheet" href="life.css">
<script src="grid.config.js"></script>
<script>
/* режим ставим до отрисовки, чтобы не мелькал акцент другого режима;
   ссылка на задачу (#task=…) всегда ведёт в рабочий режим */
(function(){var m="work";
  try{m=localStorage.getItem("grid.mode")==="life"&&!/^#task=/.test(location.hash)?"life":"work";}catch(e){}
  document.documentElement.dataset.mode=m;})();
</script>
<style>
/* ───────────────── светлая пастельная тема ───────────────── */
:root{
  color-scheme:light;
  --ground:#F6F7FB;
  --track:#EDEFF6;
  --surface:#FFFFFF;
  --surface-2:#FAFBFD;
  --ink:#212639;
  --ink-2:#5C6479;
  --ink-3:#939BB0;
  --line:#E5E8F1;
  --line-2:#D2D7E6;

  /* акцент режима: Grid Work — синий, Grid Life — зелёный (ниже) */
  --accent:#2563EB;
  --accent-hov:#1D4ED8;
  --accent-soft:#EAF1FE;
  --accent-ink:#FFFFFF;

  --p-low:#7B8AAD;    --p-low-soft:#EAEEF7;
  --p-med:#B4831F;    --p-med-soft:#FAF1DA;
  --p-high:#CC6229;   --p-high-soft:#FBEADD;
  --p-urgent:#C93A50; --p-urgent-soft:#FBE2E6;

  --danger:#C93A50;   --danger-soft:#FBE2E6;
  --warn:#B4831F;

  --h-green:#DEF3E4;  --h-green-ink:#2C6B41;
  --h-yellow:#FBF1D2; --h-yellow-ink:#7C5C13;
  --h-red:#FBE1E1;    --h-red-ink:#8F3036;
  --h-purple:#EBE5FA; --h-purple-ink:#583D8F;
  --h-blue:#DFEAFB;   --h-blue-ink:#2C5480;
  --h-orange:#FCE7D6; --h-orange-ink:#8B4B21;
  --h-teal:#D7F0EC;   --h-teal-ink:#206C61;
  --h-pink:#FBE1EE;   --h-pink-ink:#8D3265;
  --h-gray:#ECEEF3;   --h-gray-ink:#4A5168;

  /* шапки колонок: пастельный ряд (тёмный текст) и насыщенный (белый текст) */
  --c-red:#F4A9A8; --c-orange:#F7C08E; --c-yellow:#F6DC7E; --c-green:#ACD79B; --c-teal:#90D8CE;
  --c-blue:#AECAF6; --c-purple:#CFB8F3; --c-pink:#F3ADD0;
  --v-slate:#4B5568; --v-red:#D42F3B; --v-orange:#C04E0A; --v-yellow:#F2C200; --v-green:#2A8035;
  --v-teal:#0B7F73; --v-blue:#2563D9; --v-purple:#7E3FD4; --v-pink:#C2307A;

  --sh-1:0 1px 2px rgba(33,38,57,.05), 0 2px 8px rgba(33,38,57,.045);
  --sh-2:0 2px 6px rgba(33,38,57,.07), 0 12px 28px rgba(33,38,57,.09);
  --sh-drag:0 14px 34px rgba(33,38,57,.20);
  --focus:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --r-s:6px; --r-m:10px; --r-l:14px;
  --f-ui:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-dis:"Unbounded","Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
}

:root[data-mode="life"]{--accent:#167A38;--accent-hov:#12652E;--accent-soft:#E6F4EA}
/* зарегистрированные цвета плавно перетекают при смене режима */
@property --accent{syntax:"<color>";inherits:true;initial-value:#2563EB}
@property --accent-hov{syntax:"<color>";inherits:true;initial-value:#1D4ED8}
@property --accent-soft{syntax:"<color>";inherits:true;initial-value:#EAF1FE}
:root{transition:--accent .3s,--accent-hov .3s,--accent-soft .3s}
:root[data-mode="life"] .work-only,:root[data-mode="work"] .life-only{display:none !important}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ───────────────── каркас ───────────────── */
/* viewport-fit=cover: приложение рисуется до краёв экрана, а от выреза, полосы
   «домой» и скруглений его отодвигают безопасные отступы iOS */
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}

.rail{display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:30}
/* логотип — надпись, не кнопка: панель открывает только иконка слева */
.mark{font-family:var(--f-dis);font-weight:600;font-size:15px;letter-spacing:-.02em;
  color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
  padding:4px 6px;user-select:none;-webkit-user-select:none}
.mark::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail-sep{width:1px;height:22px;background:var(--line-2);flex:none}
.brand{display:flex;align-items:center;gap:4px;flex:none}
/* переключатель режимов в духе iPhone: слева Work, справа Life */
.mode-switch{position:relative;width:60px;height:28px;border-radius:99px;flex:none;margin-left:2px;
  background:var(--accent);box-shadow:inset 0 0 0 1px rgba(33,38,57,.06)}
.mode-switch::before{content:"";position:absolute;inset:-8px -4px}
.mode-switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(33,38,57,.3);display:grid;place-items:center;color:var(--accent);
  transition:transform .25s cubic-bezier(.32,.72,.3,1)}
:root[data-mode="life"] .mode-switch .knob{transform:translateX(32px)}
.mode-switch svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.mode-in{animation:modeIn .24s cubic-bezier(.32,.72,.3,1)}
@keyframes modeIn{from{opacity:0;transform:translateY(6px)}}

.b-title{font-size:16px;font-weight:600;letter-spacing:-.01em;padding:3px 8px;
  border-radius:var(--r-s);border:1px solid transparent;max-width:30ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.b-title:hover{border-color:var(--line-2);background:var(--ground)}
/* переименовать проект может только владелец */
.b-title:disabled{color:inherit;cursor:default;border-color:transparent;background:none}
.b-title-in{font-size:16px;font-weight:600;padding:3px 8px;border-radius:var(--r-s);
  border:1px solid var(--accent);background:var(--surface);width:26ch}

.tally{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:12px}
.tally .bar{width:60px;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.rail-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{position:relative}
.search input{width:180px;padding:7px 11px 7px 30px;border-radius:99px;
  border:1px solid var(--line-2);background:var(--surface);transition:border-color .15s}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:2}
select.pick{padding:7px 10px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;max-width:170px}
.toggle{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:13px;white-space:nowrap;transition:all .15s}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.toggle[aria-pressed="true"] .dot{background:var(--accent)}

.here{display:flex;align-items:center;gap:8px}
.here-lbl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:500;white-space:nowrap}
.stack{display:flex}
.stack .av{margin-left:-7px;border:2px solid var(--surface)}
.stack .av:first-child{margin-left:0}
.av{width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:#fff;background:var(--ink-3);text-transform:uppercase}
.av.sm{width:22px;height:22px;font-size:10px}
.av.ghost{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2)}
.av.lg{width:44px;height:44px;font-size:16px}
.me-btn{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--surface);
  font-size:13px;font-weight:500;max-width:160px}
.me-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn:hover{border-color:var(--accent)}

.icon-btn{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent;transition:all .15s;flex:none}
.icon-btn:hover{background:var(--ground);border-color:var(--line-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.notice{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:12.5px;
  background:var(--p-med-soft);color:var(--warn);border-bottom:1px solid var(--line)}
.notice b{font-weight:600}

/* ───────────────── вкладки ───────────────── */
.tabs{display:flex;align-items:center;gap:2px;padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;font-size:13px;
  font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}

.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ───────────────── доска ───────────────── */
.board{flex:1;min-height:0;display:flex;align-items:stretch;gap:12px;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom));overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.track{flex:0 0 306px;min-height:0;display:flex;flex-direction:column;
  background:var(--track);border-radius:var(--r-l);overflow:hidden}
.track.drag-src{opacity:.35}
/* цвет шапки приходит парой --hb (фон) / --hi (текст) из HUES */
.track-head{display:flex;align-items:center;gap:8px;padding:11px 8px 10px 12px;
  background:var(--hb,var(--line));color:var(--hi,var(--ink));cursor:grab;user-select:none;flex:none;
  touch-action:none}
.track-head:active{cursor:grabbing}
.track-head .icon-btn{color:inherit}
.track-head .icon-btn:hover{background:rgba(255,255,255,.35);border-color:transparent;color:inherit}
.track-head.vivid .track-count{background:rgba(255,255,255,.22)}
.track-head.vivid .icon-btn:hover{background:rgba(255,255,255,.2)}
.grip{width:9px;height:14px;flex:none;opacity:.4;
  background-image:radial-gradient(circle,currentColor 1.1px,transparent 1.2px);
  background-size:4.5px 4.5px}
.track-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;color:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
  padding:2px 4px;border-radius:4px;border:1px solid transparent;cursor:text}
.track-name:hover{border-color:currentColor}
.track-name-in{flex:1;min-width:0;font-weight:600;font-size:13.5px;padding:2px 5px;
  border-radius:4px;border:1px solid var(--accent);background:var(--surface);color:var(--ink)}
.track-count{font-size:11.5px;flex:none;padding:1px 6px;border-radius:99px;
  background:rgba(255,255,255,.6);color:inherit}
.track-body{flex:1;min-height:44px;overflow-y:auto;overflow-x:hidden;padding:8px;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.track-body.hot{background:var(--accent-soft)}

/* «+ Задача» живёт внутри списка, сразу под последней карточкой */
.add-card{padding:7px 8px;border-radius:var(--r-m);color:var(--ink-3);flex:none;
  font-size:13px;text-align:left;display:flex;align-items:center;gap:7px;transition:all .15s}
.add-card:hover{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.add-track{flex:0 0 240px;align-self:flex-start;border:1.5px dashed var(--line-2);
  border-radius:var(--r-l);padding:14px;color:var(--ink-3);font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.add-track:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ───────────────── карточка ───────────────── */
.card{position:relative;background:var(--surface);border-radius:var(--r-m);
  padding:10px 11px 9px 15px;box-shadow:var(--sh-1);cursor:pointer;flex:none;
  display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.card:hover{box-shadow:var(--sh-2)}
.card::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:3px;
  border-radius:99px;background:var(--pc,var(--line-2))}
.card.is-done{background:var(--surface-2)}
.card.is-done::before{background:var(--line-2)}
.card.drag-src{opacity:.32}
.card-top{display:flex;align-items:flex-start;gap:9px}
.check{width:17px;height:17px;flex:none;margin-top:1px;border-radius:5px;
  border:1.6px solid var(--line-2);background:var(--surface);display:grid;place-items:center;
  transition:all .15s;padding:0}
.check:hover{border-color:var(--accent)}
.check svg{width:11px;height:11px;stroke:var(--accent-ink);fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] svg{opacity:1}
.c-title{font-size:13.5px;line-height:1.4;font-weight:500;word-break:break-word;flex:1}
.is-done .c-title{text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:var(--ink-3);color:var(--ink-3);font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
/* чип не сжимаем: иначе узкий счётчик схлопывается и разъезжается на две строки */
.chips>.chip{flex:0 0 auto}
.chip{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:5px;padding:2px 7px;
  border-radius:5px;font-size:11.5px;font-weight:500;background:var(--ground);
  color:var(--ink-2);white-space:nowrap;line-height:1.5;max-width:100%}
.chip .pip{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.prio{color:var(--pc)}
.chip.prio.loud{background:var(--pcs)}
.chip.due{font-family:var(--f-mono);font-size:11px}
.chip.due.soon{background:var(--p-med-soft);color:var(--warn)}
.chip.due.late{background:var(--danger-soft);color:var(--danger)}
/* имя badge выбрано намеренно: subs и talk заняты блоками подзадач и комментариев */
.chip.badge{font-family:var(--f-mono);font-size:11px}
/* цвет типа и статуса приходит парой --kb (фон) / --ki (текст) */
.chip.kind,.chip.st{background:var(--kb,var(--accent-soft));color:var(--ki,var(--accent));
  overflow:hidden;text-overflow:ellipsis}
.chip svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.card-foot{display:flex;align-items:center;gap:9px}
.card-foot .sp{flex:1}
.mini-bar{flex:1;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.kebab{width:24px;height:24px;margin:-3px -6px -3px 0;border-radius:var(--r-s);flex:none;
  display:grid;place-items:center;color:var(--ink-3)}
.kebab:hover{background:var(--ground);color:var(--ink)}
.kebab svg{width:15px;height:15px;fill:currentColor}
/* полоса подзадач: иконка, прогресс «3/11» и стрелка раскрытия */
.subs-bar{flex:1;display:flex;align-items:center;gap:7px;color:var(--ink-3);font-size:11px;min-width:0}
.subs-bar svg{width:13px;height:13px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.subs-bar .mini-bar{height:4px}
.expand{width:26px;height:26px;margin:-4px -6px -4px -2px;border-radius:var(--r-s);flex:none;
  display:grid;place-items:center;color:var(--ink-2)}
.expand:hover{background:var(--ground);color:var(--ink)}
.expand svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.expand[aria-expanded="true"] svg{transform:rotate(180deg)}
/* задача с подзадачами: карточки подзадач идут под ней с отступом и линией слева.
   Класс child, а не sub: sub уже занят строкой подзадачи в панели */
.cgroup{display:flex;flex-direction:column;flex:none}
.subcards{display:flex;flex-direction:column;gap:6px;margin:6px 0 0 9px;padding-left:9px;
  border-left:2px solid var(--line-2)}
/* компактные карточки — настройка «Отображение» */
:root[data-density="compact"] #main .track-body{gap:5px}
:root[data-density="compact"] #main .card{padding:7px 9px 6px 13px;gap:5px}
:root[data-density="compact"] #main .card::before{top:7px;bottom:7px}
:root[data-density="compact"] #main .c-title{font-size:13px;line-height:1.35}
:root[data-density="compact"] #main .chips{gap:4px}
:root[data-density="compact"] #main .chip{font-size:10.5px;padding:1px 6px}
.card.child{padding:8px 10px 7px 14px;gap:6px}
.card.child .c-title{font-size:13px}
.card.child::before{top:8px;bottom:8px}

.composer{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-2);
  padding:9px;display:flex;flex-direction:column;gap:8px;flex:none}
.composer textarea{width:100%;resize:none;border:none;background:none;font-size:13.5px;
  line-height:1.4;min-height:44px;outline:none;font-family:inherit}
.composer .row{display:flex;gap:6px;align-items:center}
.btn{padding:6px 13px;border-radius:var(--r-s);font-size:13px;font-weight:500;
  background:var(--accent);color:var(--accent-ink);transition:background .15s}
.btn:hover{background:var(--accent-hov)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.hint{font-size:11px;color:var(--ink-3);margin-left:auto;font-family:var(--f-mono)}

.empty{margin:auto;text-align:center;padding:40px 20px;max-width:46ch}
.empty h2{font-family:var(--f-dis);font-weight:600;font-size:21px;margin:0 0 10px;
  letter-spacing:-.02em;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 0 20px}
.skeleton{margin:auto;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:10px}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ───────────────── Гант ───────────────── */
.pane{flex:1;min-height:0;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
/* без боковых отступов: иначе липкая колонка «Задача» стоит не у самого края
   прокрутки и в зазор слева видны уезжающие под неё даты */
.pane.wide{padding:16px 0 calc(16px + env(safe-area-inset-bottom))}
.gantt{min-width:max-content;font-size:12.5px}
/* обе строки шапки липнут как одно целое: по отдельности они обе вставали
   на top:0 и накрывали друг друга */
.g-head{position:sticky;top:0;z-index:4;width:max-content;background:var(--ground)}
.g-row{display:grid;width:max-content;align-items:center;border-bottom:1px solid var(--line)}
.g-row.head{background:var(--ground);border-bottom:1px solid var(--line-2)}
/* каждый элемент строки размещаем явно: при смешении явных и авто-ячеек
   grid уводил название задачи во вторую строку */
/* align-self:stretch обязателен: иначе пустая ячейка во второй строке шапки
   ниже самой строки и уезжающие под неё даты просвечивают сверху и снизу */
.g-name{grid-column:1;grid-row:1;align-self:stretch;padding:7px 10px 7px 16px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:sticky;left:0;
  background:var(--ground);z-index:3;display:flex;align-items:center;gap:7px}
.g-row.head .g-name{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:600}
.g-name .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--pc)}
.g-name.done{color:var(--ink-3);text-decoration:line-through}
.g-day{grid-row:1;text-align:center;font-family:var(--f-mono);font-size:10.5px;
  color:var(--ink-3);padding:6px 0;border-left:1px solid var(--line);line-height:1.3}
.g-day.we{background:var(--track)}
.g-day.today{background:var(--accent-soft);color:var(--accent);font-weight:500}
.g-cell{height:34px;border-left:1px solid var(--line);grid-row:1}
.g-cell.we{background:var(--track)}
.g-cell.today{background:var(--accent-soft)}
/* начало недели — линия чуть темнее */
.g-cell.wk{border-left-color:var(--line-2)}
.g-day.wk{box-shadow:inset 1px 0 0 var(--line-2)}
.g-bar{grid-row:1;height:19px;border-radius:99px;background:var(--pc);align-self:center;
  margin:0 2px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;
  font-weight:500;overflow:hidden;white-space:nowrap;z-index:1}
.g-bar.done{background:var(--line-2);color:var(--ink-2)}
.g-mon{grid-row:1;padding:4px 0 4px 5px;font-size:11px;font-weight:600;color:var(--ink-2);
  border-left:1px solid var(--line-2);text-transform:capitalize;overflow:hidden;white-space:nowrap}

/* ───────────────── календарь ───────────────── */
.cal{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.cal-day{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start}
.cal-week{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;
  margin-bottom:-10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.cal-when{padding-top:2px}
.cal-when .d{font-family:var(--f-dis);font-size:20px;font-weight:600;letter-spacing:-.02em;
  line-height:1.1}
.cal-when .m{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.cal-when.late .d{color:var(--danger)}
.cal-when.today .d{color:var(--accent)}
.cal-list{display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--sh-1);cursor:pointer}
.cal-item:hover{box-shadow:var(--sh-2)}
.cal-item .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--pc)}
.cal-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item.done .t{text-decoration:line-through;color:var(--ink-3)}
.cal-item .metas{display:flex;gap:10px;min-width:0}
.cal-item .meta{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.cal-when .ms{display:none}

/* ───────────────── заметки и файлы ───────────────── */
.notes{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sect-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sect-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:0}
.sect-h .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.sect-h .bar{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden;max-width:110px}
.sect-h .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.sect-h .sp{flex:1}
.note-area{width:100%;min-height:190px;resize:vertical;padding:13px 15px;
  border-radius:var(--r-l);border:1px solid var(--line-2);background:var(--surface);
  font-size:14px;line-height:1.6;outline:none;font-family:inherit}
.note-area:focus{border-color:var(--accent)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--sh-1)}
.file .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;flex:none}
.file .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.file .nm{flex:1;min-width:0}
.file .nm b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.file .nm span{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.file .x{color:var(--ink-3);width:26px;height:26px;border-radius:5px;display:grid;
  place-items:center;flex:none}
.file .x:hover{background:var(--danger-soft);color:var(--danger)}
.file .x svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.drop-hint{font-size:12.5px;color:var(--ink-3);padding:12px;text-align:center;
  border:1.5px dashed var(--line-2);border-radius:var(--r-m)}
.ncards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ncard{background:var(--nb,var(--surface));border-radius:var(--r-l);padding:12px 14px 13px;
  box-shadow:var(--sh-1);cursor:pointer;display:flex;flex-direction:column;gap:7px;
  min-height:122px;transition:box-shadow .15s}
.ncard:hover{box-shadow:var(--sh-2)}
.ncard .top{display:flex;align-items:center;gap:8px;min-width:0}
.ncard .top .chip{min-width:0}
.ncard.tinted .chip.kind{background:rgba(255,255,255,.72)}
.ncard time{margin-left:auto;font-size:11px;color:var(--ink-2);font-family:var(--f-mono);flex:none}
.ncard h4{margin:0;font-size:14.5px;font-weight:600;line-height:1.35;word-break:break-word}
.ncard p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.5;white-space:pre-wrap;
  word-break:break-word;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.arch{display:flex;flex-direction:column;gap:6px}
.arow{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--sh-1)}
.arow .t{flex:1;min-width:0;text-align:left}
.arow .t b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .t span{font-size:11.5px;color:var(--ink-3)}
.arow .t:hover b{color:var(--accent)}

/* ───────────────── панель задачи ───────────────── */
.scrim{position:fixed;inset:0;background:rgba(33,38,57,.28);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:50;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) 0;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-2);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.32,.72,.3,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;
  border-bottom:1px solid var(--line);flex:none}
.d-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.d-title-row{display:flex;gap:11px;align-items:flex-start}
.d-title{flex:1;font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em;
  border:1px solid transparent;border-radius:var(--r-s);padding:4px 6px;resize:none;
  background:none;width:100%;overflow:hidden;font-family:inherit}
.d-title:hover{border-color:var(--line)}
.d-title:focus{border-color:var(--accent);outline:none;background:var(--ground)}
.d-title.done{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}

.fields{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;align-items:center}
.fields .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.fields .ctl{min-width:0}
.fields select,.fields input[type="date"],.fields input[type="text"]{width:100%;
  padding:6px 9px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer}
.fields select:focus,.fields input:focus{border-color:var(--accent);outline:none}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* min-width:0 обязателен: поле даты в мобильном Safari требует ширину под
   «8 сент. 2026 г.» и без этого распирает колонку за край экрана */
.dt{display:flex;flex-direction:column;gap:3px;min-width:0}
.dt>span{font-size:10px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;
  font-weight:500}
.fields .dt input{min-width:0;width:100%}

.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:5px 9px;border-radius:var(--r-s);font-size:12px;font-weight:500;
  border:1px solid var(--line-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button .pip{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.seg button[aria-pressed="true"]{background:var(--pcs);border-color:var(--pc);color:var(--pc)}
/* наблюдатель видит выбранное, но не меняет */
.seg button:disabled,.check:disabled,.tint:disabled{cursor:default}
.seg button:disabled:not([aria-pressed="true"]){opacity:.5}
.fields select:disabled,.fields input:disabled{cursor:default;opacity:1;color:var(--ink);background:var(--ground)}
.d-title[readonly]:hover,.d-title[readonly]:focus{border-color:transparent;background:none}
.seg.kinds button svg{width:13px;height:13px;fill:none;stroke:var(--ki,currentColor);stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.seg.kinds button[aria-pressed="true"]{background:var(--kb,var(--accent-soft));
  border-color:var(--ki,var(--accent));color:var(--ki,var(--accent))}
.seg.kinds button.add{border-style:dashed;color:var(--ink-3)}
.seg.kinds button.add:hover{color:var(--accent);border-color:var(--accent)}
.seg .tints{gap:4px}
.ctl-row{display:flex;align-items:center;gap:6px}
.ctl-row select{flex:1;min-width:0}

.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:flex-start;gap:9px;padding:5px 6px;border-radius:var(--r-s)}
.sub:hover{background:var(--ground)}
.sub .txt{flex:1;min-width:0;font-size:13.5px;line-height:1.4;word-break:break-word;text-align:left}
.sub .txt:hover{color:var(--accent)}
.sub.done .txt{text-decoration:line-through;color:var(--ink-3)}
.sub .chip{flex:none}
.d-parent{align-self:flex-start;margin:-10px 0 -6px 22px}
.d-body>.d-title{flex:none}
.chips>.av{margin-left:auto}
.d-desc.n-body{min-height:300px;font-size:14px;line-height:1.6}
.sub .x{opacity:0;color:var(--ink-3);width:20px;height:20px;border-radius:4px;
  display:grid;place-items:center;flex:none}
.sub:hover .x{opacity:1}
.sub .x:hover{background:var(--danger-soft);color:var(--danger)}
.sub .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sub-add{display:flex;align-items:center;gap:9px;padding:5px 6px}
.sub-add input{flex:1;border:none;background:none;outline:none;font-size:13.5px;
  border-bottom:1px solid transparent;padding:2px 0}
.sub-add input:focus{border-bottom-color:var(--accent)}

.d-desc{width:100%;min-height:82px;resize:vertical;padding:9px 10px;border-radius:var(--r-m);
  border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;line-height:1.5;
  font-family:inherit}
.d-desc:focus{border-color:var(--accent);outline:none}

.talk{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px}
.msg .body{flex:1;min-width:0}
.msg .who{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.msg .who b{font-size:12.5px;font-weight:600}
.msg .who time{font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.msg .txt{font-size:13.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.msg .x{opacity:0;color:var(--ink-3);width:20px;height:20px;border-radius:4px;
  display:grid;place-items:center;flex:none;align-self:flex-start}
.msg:hover .x{opacity:1}
.msg .x:hover{background:var(--danger-soft);color:var(--danger)}
.msg .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.talk-add{display:flex;gap:8px;align-items:flex-end}
.talk-add textarea{flex:1;min-height:38px;max-height:130px;resize:none;padding:8px 10px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);
  font-size:13.5px;line-height:1.45;outline:none;font-family:inherit}
.talk-add textarea:focus{border-color:var(--accent)}

.d-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:10px;flex:none}
.d-foot .stamp{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}

/* ───────────────── всплывающие панели ───────────────── */
.sheet{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--sh-2);width:306px;padding:12px;
  display:flex;flex-direction:column;gap:4px;max-height:72vh;overflow-y:auto}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:0 0 6px}
.sheet .note{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin:0 0 8px}
.mrow{display:flex;align-items:center;gap:9px;padding:5px;border-radius:var(--r-s)}
.mrow:hover{background:var(--ground)}
.mrow input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:13.5px;
  border-bottom:1px solid transparent;padding:2px 0}
.mrow input:focus{border-bottom-color:var(--accent)}
.mrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .lbl b{font-weight:500}
.mrow .lbl small{display:block;font-size:11.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.mrow select.role{padding:4px 6px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);font-size:12.5px;flex:none}
.mrow .role-l{font-size:12px;color:var(--ink-3);flex:none}
.mrow .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex:none}
.mrow .x{opacity:0;color:var(--ink-3);width:24px;height:24px;border-radius:4px;
  display:grid;place-items:center;flex:none}
.mrow:hover .x{opacity:1}
.mrow .x:hover{background:var(--danger-soft);color:var(--danger)}
.mrow .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sheet-add{display:flex;gap:6px;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.sheet-add input{flex:1;min-width:0;padding:6px 9px;border-radius:var(--r-s);
  border:1px solid var(--line-2);background:var(--surface);outline:none}
.sheet-add input:focus{border-color:var(--accent)}
.sheet .fl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:600;margin:10px 0 6px}
.sheet .in{width:100%;padding:7px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);outline:none}
.sheet .in:focus{border-color:var(--accent)}
.sheet .in.bad{border-color:var(--danger)}
.sheet .row{display:flex;gap:6px;margin-top:12px}
.sheet .sp{flex:1}
.mrow .chip{min-width:0}
/* меню действий: строки с иконкой */
.sheet.menu{padding:6px;gap:0;width:272px}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-s);
  font-size:13.5px;text-align:left;color:var(--ink)}
.mi:hover{background:var(--ground)}
.mi svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round;flex:none;color:var(--ink-2)}
.mi.danger,.mi.danger svg{color:var(--danger)}
.mi.danger:hover{background:var(--danger-soft)}
.menu hr{border:none;border-top:1px solid var(--line);margin:5px 4px}
.prow .pick svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;
  stroke-linejoin:round;color:var(--ink-3);flex:none}
.prow.on .pick svg{color:var(--accent)}
.mi>span:not(.more){flex:1;min-width:0}
.mi .more{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--ink-3);font-size:12px;
  min-width:0;max-width:45%}
.mi .more .h{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .more svg{width:14px;height:14px;color:var(--ink-3)}
.mi small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.mi[aria-disabled="true"]{color:var(--ink-3);cursor:default}
.mi[aria-disabled="true"]:hover{background:none}
.menu .cap{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;padding:8px 10px 6px}
.menu .note{padding:2px 10px 8px;margin:0}
.menu .back{display:flex;align-items:center;gap:6px;width:100%;padding:7px 8px;border-radius:var(--r-s);
  font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);text-align:left}
.menu .back:hover{background:var(--ground);color:var(--ink)}
.menu .back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.menu .pad{padding:4px 6px 8px}
/* палитра шапок: два ряда по девять кружков */
.hues{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;padding:0 6px 6px}
.hue{aspect-ratio:1;border-radius:50%;border:2px solid transparent;display:grid;place-items:center;min-width:24px}
.hue i{width:76%;height:76%;border-radius:50%;background:var(--hb,var(--line));display:grid;place-items:center}
.hue.none i{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.hue svg{width:12px;height:12px;fill:none;stroke:var(--hi,var(--ink));stroke-width:3;stroke-linecap:round;
  stroke-linejoin:round;opacity:0}
.hue[aria-pressed="true"]{border-color:var(--ink-3)}
.hue[aria-pressed="true"] svg{opacity:1}

/* ───────────────── боковая панель проектов ───────────────── */
.side{position:fixed;top:0;left:0;bottom:0;width:min(300px,86vw);z-index:50;background:var(--surface);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom) env(safe-area-inset-left);
  border-right:1px solid var(--line);box-shadow:var(--sh-2);transform:translateX(-102%);
  transition:transform .24s cubic-bezier(.32,.72,.3,1);display:flex;flex-direction:column}
.side.on{transform:none}
.side:focus,.side:focus-visible{outline:none;box-shadow:var(--sh-2)}
.side-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line)}
.side-head h2{flex:1;margin:0;font-size:15px;font-weight:600}
.side-body{flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.side-note{font-size:12px;color:var(--ink-3);line-height:1.45;margin:0;padding:2px 8px 10px}
.prow{display:flex;align-items:center;gap:6px;border-radius:var(--r-m)}
.prow:hover{background:var(--ground)}
.prow.on{background:var(--accent-soft)}
.prow .pick:focus-visible{box-shadow:none}
.prow:has(.pick:focus-visible){box-shadow:var(--focus)}
.prow .pick{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:9px 8px 9px 10px;text-align:left}
.prow .pick b{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.on .pick b{color:var(--accent);font-weight:600}
.prow .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.prow .x{opacity:0;width:28px;height:28px;margin-right:4px;border-radius:var(--r-s);display:grid;
  place-items:center;color:var(--ink-3);flex:none}
.prow:hover .x,.prow .x:focus-visible{opacity:1}
.prow .x:hover{background:var(--danger-soft);color:var(--danger)}
.prow .x svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
@media (hover:none){.prow .x{opacity:1}}
.side-add{display:flex;gap:6px;padding:8px 0 0}
.side-add input{flex:1;min-width:0;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);outline:none}
.side-add input:focus{border-color:var(--accent)}
.side-foot{padding:6px;border-top:1px solid var(--line)}

/* ───────────────── настройки ───────────────── */
.set{display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.55}
.set p{margin:0;color:var(--ink-2)}
.set p.small{font-size:12.5px;color:var(--ink-3)}
.choice{display:flex;flex-direction:column;gap:6px}
.choice label{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-radius:var(--r-m);
  border:1px solid var(--line-2);cursor:pointer}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.choice input{margin:3px 0 0;accent-color:var(--accent)}
.choice small{display:block;color:var(--ink-3);font-size:12px}
.feed{display:flex;gap:6px}
.feed input{flex:1;min-width:0;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface-2);font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.steps{border:1px solid var(--line);border-radius:var(--r-m);padding:2px 12px}
.steps summary{cursor:pointer;padding:8px 0;font-weight:500}
.steps ol{margin:0 0 10px;padding-left:20px;color:var(--ink-2)}
.set .row{display:flex;gap:8px;flex-wrap:wrap}
.set .btn.ghost{border:1px solid var(--line-2)}
.set .in{width:100%;padding:8px 10px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);outline:none}
.set .in:focus{border-color:var(--accent)}
.who-row{display:flex;align-items:center;gap:12px}
.who-row>div{flex:1;min-width:0}
.who-row small{display:block;margin-top:4px;font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis}
.invite{display:flex;gap:6px;flex-wrap:wrap}
.invite input.in{flex:1 1 180px;width:auto;min-width:0}
.invite select.in{flex:none;width:auto}
.set .arow{box-shadow:none;border:1px solid var(--line);padding:7px 9px}
/* настройки Work: группа «лично для вас» и группа проекта */
.wset>.set+.set{margin-top:22px}
.wset>.set-group{margin-top:34px;padding-top:18px;border-top:1px solid var(--line)}
.wset>.set-group:first-child{margin-top:0;padding-top:0;border-top:none}
.set-group h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.set-group p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px}
.opt>span{color:var(--ink-2)}
.set .opt select.in{width:auto;min-width:150px;flex:none}
.set textarea.in{resize:vertical;font-family:inherit;line-height:1.5}
.set .pre{white-space:pre-wrap;word-break:break-word}
.tl{display:flex;flex-direction:column;gap:7px}
.tl-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tl-h b{font-weight:500}
.meter-h{display:flex;justify-content:space-between;gap:8px}
.meter-h span{color:var(--ink-3);font-family:var(--f-mono);font-size:12px}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.meter.warn i{background:var(--warn)}
.av.photo{background:none;overflow:hidden}
.av.photo img{width:100%;height:100%;object-fit:cover;display:block}
.who-row>.av-edit{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.tl .none{font-size:12.5px;color:var(--ink-3)}
.set a.btn{text-decoration:none}
.toast-undo{margin-left:14px;color:#fff;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.cal-add{display:flex;gap:6px;flex-wrap:wrap}
.cal-add .btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:12px;
  border:1px solid var(--line-2);text-decoration:none}
.cal-add .btn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
/* выбор цвета и иконки */
.tints{display:flex;flex-wrap:wrap;gap:4px}
.tint{width:27px;height:27px;border-radius:50%;border:2px solid transparent;display:grid;place-items:center}
/* кружок показываем насыщенным цветом текста: пастельные фоны на глаз почти не различить */
.tint i{width:20px;height:20px;border-radius:50%;background:var(--ki)}
.tint[aria-pressed="true"]{border-color:var(--ki)}
.tint.none i{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.icons{display:grid;grid-template-columns:repeat(8,1fr);gap:3px}
.icons button{aspect-ratio:1;border-radius:var(--r-s);display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent}
.icons button:hover{background:var(--ground)}
.icons button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.icons svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.st-dot{width:24px;height:24px;border-radius:50%;flex:none;display:grid;place-items:center}
.st-dot i{width:14px;height:14px;border-radius:50%;background:var(--ki)}
.st-dot:hover{background:var(--line)}
.mrow .lock{width:24px;height:24px;display:grid;place-items:center;color:var(--ink-3);flex:none}
.mrow .lock svg,.mrow .x.ed svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.sheet .mrow+.tints{padding:4px 5px 8px 36px}
.confirm{padding:10px;border-radius:var(--r-m);background:var(--danger-soft);color:var(--ink);
  display:flex;flex-direction:column;gap:8px;font-size:12.5px;line-height:1.45;margin:2px 0 6px}
.confirm .row{margin-top:0}
.switch{display:flex;align-items:flex-start;gap:10px;cursor:pointer;padding:2px 0 8px}
.switch input{appearance:none;-webkit-appearance:none;width:34px;height:20px;margin:1px 0 0;
  border-radius:99px;background:var(--line-2);position:relative;flex:none;cursor:pointer;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 2px rgba(33,38,57,.25);transition:transform .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{transform:translateX(14px)}
.switch b{display:block;font-weight:500;font-size:13px}
.switch small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.45;margin-top:2px}
.lnk{font-size:12px;font-weight:500;color:var(--accent);padding:3px 6px;border-radius:var(--r-s);
  display:inline-flex;align-items:center;gap:5px}
.lnk:hover{background:var(--accent-soft)}
.lnk svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* без наведения кнопки удаления в строках видны всегда, иначе их не найти пальцем */
@media (hover:none){.mrow .x,.sub .x,.msg .x{opacity:1}}

.drag-ghost{position:fixed;z-index:90;pointer-events:none;box-shadow:var(--sh-drag);
  transform:rotate(1.6deg);opacity:.96;border-radius:var(--r-m)}
.drag-ghost.col{border-radius:var(--r-l);transform:rotate(.8deg)}
.slot{border-radius:var(--r-m);background:var(--accent-soft);
  border:1.5px dashed var(--accent);flex:none}
.slot.col{border-radius:var(--r-l);align-self:stretch}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:95;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;line-height:1.45;
  font-size:13px;box-shadow:var(--sh-2);width:max-content;max-width:min(560px,calc(100vw - 32px))}

/* ───────────────── вход ───────────────── */
/* экран входа лежит под шапкой: переключатель режимов остаётся доступен */
.gate{position:fixed;inset:0;z-index:25;background:var(--ground);
  display:flex;align-items:center;justify-content:center;overflow-y:auto;
  padding:calc(84px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.gated .rail .work-only,:root[data-mode="work"] .gated #btnSide{display:none}
.gate-box{width:100%;max-width:392px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh-2);padding:26px}
.gate-mark{font-family:var(--f-dis);font-weight:600;font-size:19px;color:var(--accent);
  letter-spacing:-.02em;margin-bottom:18px}
.gate h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
.gate p{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0 0 18px}
.gate p.small{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}
.gate label{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 5px}
.gate .fld{margin-bottom:13px}
.gate input{width:100%;padding:9px 11px;border-radius:var(--r-m);border:1px solid var(--line-2);
  background:var(--surface);outline:none;font-size:13.5px}
.gate input:focus{border-color:var(--accent)}
.gate .btn{display:block;width:100%;padding:10px;text-align:center;font-size:14px}
.gate .btn.ghost,.sheet .btn.ghost{background:transparent;color:var(--ink-2);
  border:1px solid var(--line-2)}
.gate .btn.ghost{margin-top:9px}
.gate .btn.ghost:hover,.sheet .btn.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.gate .msg{font-size:12.5px;padding:9px 11px;border-radius:var(--r-m);margin-bottom:14px;line-height:1.5}
.gate .msg.ok{background:var(--accent-soft);color:var(--accent)}
.gate .msg.bad{background:var(--danger-soft);color:var(--danger)}
.gate code{font-family:var(--f-mono);font-size:12px;background:var(--ground);
  padding:1px 5px;border-radius:4px;word-break:break-all}

/* ───────────────── узкий экран ───────────────── */
@media (max-width:640px){
  .rail{gap:9px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px}
  .brand+.rail-sep{display:none}
  .rail-right{gap:7px;flex:1 1 100%;margin:0 -12px;padding:2px 12px;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
  .rail-right::-webkit-scrollbar{display:none}
  .rail-right>*{flex:none}
  .rail-right .rail-sep{display:none}
  .search input{width:160px}
  select.pick{max-width:none}
  .notice{padding:6px 12px;font-size:12px}
  .tabs{padding:0 8px}
  .tab{padding:9px 10px;gap:6px}
  .board{padding:12px 12px calc(12px + env(safe-area-inset-bottom));gap:10px}
  .track{flex:0 0 86vw;max-width:320px}
  .pane{padding:12px 12px calc(12px + env(safe-area-inset-bottom))}
  .pane.wide{padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
  /* подпись над полем, а не слева: на узкой панели делить ширину нечем */
  .fields{grid-template-columns:1fr;gap:3px 0}
  .fields .lbl{margin-top:9px}
  .cal-day{grid-template-columns:48px minmax(0,1fr);gap:10px}
  .cal-when .d{font-size:18px}
  .cal-when .mf{display:none}
  .cal-when .ms{display:inline}
  .cal-item{flex-wrap:wrap;align-items:flex-start;row-gap:3px}
  .cal-item .dot{margin-top:6px}
  .cal-item .t{flex:1 1 calc(100% - 52px);white-space:normal;overflow:visible;word-break:break-word;line-height:1.4}
  .cal-item .av{order:1}
  .cal-item .metas{order:2;flex:1 1 100%;flex-wrap:wrap;gap:4px 10px;padding-left:17px}
  .cal-item .meta{white-space:normal}
  .drawer{width:100vw}
}
@media (max-width:430px){
  .dates{grid-template-columns:1fr}
}

/* ───────────────── низкий экран (телефон боком) ─────────────────
   Не запираем страницу в 100dvh: на шапку и вкладки уходит вся высота,
   и на диаграмму не остаётся ничего — виден один заголовок. Пусть
   вместо этого прокручивается сама страница. */
@media (max-height:560px){
  .app{height:auto;min-height:100dvh;overflow:visible}
  .main{overflow:visible}
  .pane{min-height:320px}
  .board{min-height:340px}
}
</style>
</head>
<body>

<div class="app">
  <header class="rail">
    <div class="brand">
      <button class="icon-btn" id="btnSide" title="Боковая панель" aria-label="Боковая панель" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2.5"></rect><path d="M9.5 4v16"></path><path d="M13.5 10l2 2-2 2"></path></svg>
      </button>
      <span class="mark" id="logo"><span>Grid</span><span id="modeName">Work</span></span>
      <button class="mode-switch" id="modeSwitch" role="switch" aria-checked="false" aria-label="Личный режим Grid Life"><span class="knob"></span></button>
    </div>
    <span class="rail-sep work-only"></span>
    <button class="b-title work-only" id="boardTitle" title="Переименовать проект">Проект</button>
    <div class="tally work-only" id="tally"></div>

    <div class="rail-right work-only">
      <div class="here" id="here" hidden>
        <span class="here-lbl">на доске</span>
        <div class="stack" id="stack"></div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Поиск задач" aria-label="Поиск задач">
      </div>
      <select class="pick" id="fAssignee" aria-label="Фильтр по ответственному"></select>
      <select class="pick" id="fPriority" aria-label="Фильтр по приоритету"></select>
      <button class="toggle" id="fDone" aria-pressed="false"><span class="dot"></span>Скрыть выполненные</button>
      <span class="rail-sep"></span>
      <button class="icon-btn" id="btnMembers" title="Участники" aria-label="Участники">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c0-3.1 2.5-5 5.5-5s5.5 1.9 5.5 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.6"></path><path d="M17.5 14.2c2 .6 3.5 2.2 3.5 4.8"></path></svg>
      </button>
      <button class="me-btn" id="btnMe"></button>
    </div>
  </header>

  <div class="notice work-only" id="notice" hidden></div>

  <nav class="tabs work-only" id="tabs" role="tablist"></nav>

  <main class="main work-only" id="main">
    <div class="skeleton"><span class="spin"></span>Подключаемся к доске…</div>
  </main>
  <main class="main life-only" id="lifeMain"></main>
</div>

<div class="scrim" id="scrim"></div>
<div class="scrim" id="sideScrim"></div>
<aside class="side" id="side" tabindex="-1" aria-hidden="true" aria-label="Проекты"></aside>
<aside class="drawer" id="settings" aria-hidden="true" aria-label="Настройки"></aside>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Детали задачи"></aside>
<div class="gate work-only" id="gate" hidden></div>
<input type="file" id="filePick" hidden>

<script>
(function(){
"use strict";

/* ═════════ утилиты ═════════ */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var uid=function(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var clamp=function(n,a,b){return Math.max(a,Math.min(b,n));};

var PRIOS=[{id:"low",label:"Низкий"},{id:"med",label:"Средний"},
           {id:"high",label:"Высокий"},{id:"urgent",label:"Срочно"}];
/* стандартные типы; свои типы проекта лежат в коллекции kinds */
var TASK_KINDS=[{id:"report",label:"Отчёты",icon:"report"},{id:"learn",label:"Обучение",icon:"learn"},
                {id:"improve",label:"Улучшайзинг",icon:"improve"},{id:"idea",label:"Идея",icon:"idea"},
                {id:"note",label:"Заметка",icon:"note"},{id:"urgent",label:"Срочно",icon:"urgent"}];
var NOTE_KINDS=[{id:"memo",label:"Заметка",icon:"note"},{id:"deal",label:"Договорённость",icon:"check"},
                {id:"meet",label:"Встреча",icon:"calendar"},{id:"howto",label:"Инструкция",icon:"book"},
                {id:"links",label:"Ссылки",icon:"link"},{id:"idea",label:"Идея",icon:"idea"}];
/* цвета типов, статусов и заметок: пастельные пары фон/текст --h-* */
var TINTS=[{id:"gray",label:"Серый"},{id:"red",label:"Красный"},{id:"orange",label:"Оранжевый"},
           {id:"yellow",label:"Жёлтый"},{id:"green",label:"Зелёный"},{id:"teal",label:"Бирюзовый"},
           {id:"blue",label:"Синий"},{id:"purple",label:"Фиолетовый"},{id:"pink",label:"Розовый"}];
/* цвета шапок колонок: прежние ключи — пастельный ряд, v-* — насыщенный */
var HUE_ROWS=[
  [{id:"",label:"Без цвета"},{id:"red",label:"Красный"},{id:"orange",label:"Оранжевый"},
   {id:"yellow",label:"Жёлтый"},{id:"green",label:"Зелёный"},{id:"teal",label:"Бирюзовый"},
   {id:"blue",label:"Голубой"},{id:"purple",label:"Сиреневый"},{id:"pink",label:"Розовый"}],
  [{id:"v-slate",label:"Графитовый"},{id:"v-red",label:"Ярко-красный"},{id:"v-orange",label:"Ярко-оранжевый"},
   {id:"v-yellow",label:"Ярко-жёлтый"},{id:"v-green",label:"Ярко-зелёный"},{id:"v-teal",label:"Ярко-бирюзовый"},
   {id:"v-blue",label:"Синий"},{id:"v-purple",label:"Фиолетовый"},{id:"v-pink",label:"Малиновый"}]];
/* насыщенные шапки — с белым текстом, кроме жёлтой */
function hueStyle(id){
  var vivid=/^v-/.test(id||"");

function ic(name){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+(ICONS[name]||ICONS.note)+"</svg>";}

function labelOf(list,id,dflt){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].label;}return dflt||"";}

var MONTHS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var MONTHS_FULL=["январь","февраль","март","апрель","май","июнь","июль",
                 "август","сентябрь","октябрь","ноябрь","декабрь"];
var WEEK=["вс","пн","вт","ср","чт","пт","сб"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return iso(new Date());}
function parseISO(s){var p=String(s||"").split("-");
  return p.length===3&&p[0]?new Date(+p[0],+p[1]-1,+p[2]):null;}
function daysBetween(a,b){return Math.round((b-a)/864e5);}
function shortDate(d){
  return d.getDate()+" "+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+String(d.getFullYear()).slice(2):"");
}
/* дата в Grid Work — в формате из личных настроек: «27 окт» или «27.10.26» */
function wDate(d){
  if(prefs().dateFmt!=="num") return shortDate(d);
  return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getFullYear()).slice(2);
}
function dueInfo(s){
  var d=parseISO(s); if(!d) return null;
  var n=daysBetween(parseISO(todayISO()),d);
  var label=n===0?"сегодня":n===1?"завтра":n===-1?"вчера":wDate(d);
  return {label:label,days:n,state:n<0?"late":(n<=2?"soon":"")};
}
function initials(name){
  var p=String(name||"?").trim().split(/\s+/).filter(Boolean);
  return p.length?(p[0][0]+(p[1]?p[1][0]:"")).toUpperCase():"?";
}
function fmtSize(n){
  n=Number(n)||0;
  return n<1024?n+" Б":n<1048576?(n/1024).toFixed(0)+" КБ":n<1073741824?(n/1048576).toFixed(1).replace(/\.0$/,"")+" МБ"
    :(n/1073741824).toFixed(1).replace(/\.0$/,"")+" ГБ";
}
function fmtWhen(ts){
  if(!ts) return "";
  var d=new Date(ts),n=new Date();
  var hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return d.toDateString()===n.toDateString()?hm:(d.getDate()+" "+MONTHS[d.getMonth()]+", "+hm);
}

/* ═════════ выборки ═════════ */
function find(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function project(id){return find(S.projects,id||S.project);}
function column(id){return find(S.columns,id);}
function card(id){return find(S.cards,id);}
function person(id){return id?find(S.profiles,id):null;}
function nameOf(p){return p?p.name||String(p.email||"").split("@")[0]||"Участник":"";}
function me(){return person(S.me);}
/* личные настройки отображения лежат в профиле (profiles.settings) —
   они одинаковы на всех устройствах человека */
var PREFS={view:"board",hideDone:false,density:"normal",weekStart:1,dateFmt:"short"};
function prefs(){var s=(me()||{}).settings;return Object.assign({},PREFS,s&&typeof s==="object"?s:{});}
/* вид и «скрывать выполненные» действуют с открытия Grid Work */
function applyPrefs(){
  var p=prefs();
  S.tab=p.view; S.filter.hideDone=!!p.hideDone;
  $("#fDone").setAttribute("aria-pressed",String(S.filter.hideDone));
}
function byOrder(a,b){return (a.order||0)-(b.order||0)||String(a.id).localeCompare(String(b.id));}
function projName(){var p=project();return p?p.name:"Проект";}
/* в корзине — всё, у чего стоит deletedAt */
function liveProjects(){return S.projects.filter(function(p){return !p.deletedAt;}).sort(byOrder);}
function colsOf(pid){return S.columns.filter(function(c){return c.projectId===pid&&!c.deletedAt;}).sort(byOrder);}
function cols(){return colsOf(S.project);}
function colPath(col){var p=project(col.projectId);return (p?p.name:"?")+" » "+col.title;}
/* задача на доске: ни она, ни её колонка, ни проект не в корзине */
function onBoard(c){
  var col=column(c.columnId),p=col&&project(col.projectId);
  return !c.deletedAt&&!!col&&!col.deletedAt&&!!p&&!p.deletedAt;
}
/* живые задачи проекта, включая подзадачи; архив сюда не входит */
function projCards(){return S.cards.filter(function(c){return c.projectId===S.project&&!c.archived&&onBoard(c);});}
function topCards(){return projCards().filter(function(c){return !c.parentId;});}
function cardsIn(colId){return S.cards.filter(function(c){
  return c.columnId===colId&&!c.parentId&&!c.archived&&!c.deletedAt;}).sort(byOrder);}
function childrenOf(id){return S.cards.filter(function(c){return c.parentId===id&&!c.archived&&!c.deletedAt;}).sort(byOrder);}
function archivedCards(){return S.cards.filter(function(c){
  return c.projectId===S.project&&c.archived&&!c.parentId&&onBoard(c);})
  .sort(function(a,b){return (b.archivedAt||0)-(a.archivedAt||0);});}

/* Роли в проекте: владелец — всё; редактор — задачи, колонки, заметки и
   файлы; наблюдатель — смотрит и комментирует. Те же правила держит база
   (supabase-schema.sql), интерфейс лишь не предлагает недоступного. */
var ROLES=[{id:"owner",label:"Владелец",note:"всё, включая участников, статусы и типы, удаление колонок и проектов"},
           {id:"editor",label:"Редактор",note:"задачи, колонки, заметки и файлы"},
           {id:"viewer",label:"Наблюдатель",note:"смотрит и комментирует"}];
function membersOf(pid){pid=pid||S.project;return S.project_members.filter(function(m){return m.projectId===pid;});}
function roleOf(pid,who){
  var m=membersOf(pid).filter(function(x){return x.userId&&x.userId===(who||S.me);})[0];
  return m?m.role:"";
}
function canEdit(pid){var r=roleOf(pid);return r==="owner"||r==="editor";}
function isOwner(pid){return roleOf(pid)==="owner";}
/* ответственным можно назначить только вошедшего участника проекта */
function people(pid){
  return membersOf(pid).filter(function(m){return m.userId;}).map(function(m){
    return person(m.userId)||{id:m.userId,name:"",email:m.email,color:""};
  }).sort(function(a,b){return nameOf(a).localeCompare(nameOf(b),"ru");});
}
function endOf(colId){var t=cardsIn(colId);return orderBetween(t.length?t[t.length-1].order:null,null);}
function projNotes(){return S.notes.filter(function(n){return n.projectId===S.project;}).sort(byOrder);}

/* типы: стандартные плюс свои типы проекта */
function kindsFor(scope,pid){
  var own=S.kinds.filter(function(k){return k.scope===scope&&k.projectId===(pid||S.project);}).sort(byOrder);
  return (scope==="note"?NOTE_KINDS:TASK_KINDS).concat(own);
}
function kindInfo(scope,id){
  if(!id) return null;
  return find(scope==="note"?NOTE_KINDS:TASK_KINDS,id)||find(S.kinds,id);
}
function kindChip(k){
  return '<span class="chip kind"'+(k.color?' style="'+tint(k.color)+'"':"")+">"+ic(k.icon)+esc(k.label)+"</span>";
}
/* у каждого проекта свои статусы. Статус с isDone ставится выполненным
   задачам; его можно переименовать, но не удалить */
var DEFAULT_STATUSES=[["todo","Не начата","gray"],["doing","В работе","blue"],["blocked","Нужна помощь","red"],
                      ["review","На проверке","yellow"],["done","Готова","green"]];
function statusRows(pid,idOf){
  return DEFAULT_STATUSES.map(function(s,i){
    return {id:idOf(s[0]),projectId:pid,label:s[1],color:s[2],order:(i+1)*1000,isDone:s[0]==="done"};});
}
function statusList(pid){pid=pid||S.project;return S.statuses.filter(function(s){return s.projectId===pid;}).sort(byOrder);}
function statusOf(id){return find(S.statuses,id);}
function doneStatus(pid){return statusList(pid).filter(function(s){return s.isDone;})[0]||null;}
function startStatus(pid){return statusList(pid).filter(function(s){return !s.isDone;})[0]||null;}
function commentsOf(id){return S.comments.filter(function(c){return c.cardId===id;})
  .sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});}
function filesOf(id){return S.files.filter(function(f){return f.cardId===id;})
  .sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});}
/* файлы проекта; файлы задач из корзины лежат в корзине вместе с ними */
function projFiles(){return S.files.filter(function(f){
    var c=f.cardId&&card(f.cardId);
    return f.projectId===S.project&&(!f.cardId||c&&onBoard(c));})
  .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});}
function passes(c){
  var f=S.filter;
  if(f.hideDone&&c.done) return false;
  if(f.assignee!=="all"&&(c.assignee||"")!==(f.assignee==="none"?"":f.assignee)) return false;
  if(f.priority!=="all"&&(c.priority||"med")!==f.priority) return false;
  if(f.q){
    var k=kindInfo("task",c.kind);
    var hay=(c.title||"")+" "+(c.desc||"")+" "+(k?k.label:"");
    if(hay.toLowerCase().indexOf(f.q.toLowerCase())<0) return false;
  }
  return true;
}
/* задача видна, если под фильтр подходит она сама или хоть одна её подзадача */
function shown(c){return passes(c)||childrenOf(c.id).some(passes);}
function visibleIn(colId){return cardsIn(colId).filter(shown);}

/* ═════════ хранилище ═════════ */
var COLLS=["projects","project_members","profiles","columns","cards","comments","files","notes","statuses","kinds","feeds"];
/* поле в браузере → колонка таблицы с тем же именем, что и коллекция */
var MAP={
  projects:{name:"name",descr:"descr",order:"pos",doneMoveDefault:"done_move_default",deletedAt:"deleted_at"},
  project_members:{projectId:"project_id",userId:"user_id",email:"email",role:"role",createdAt:"created_at"},
  profiles:{email:"email",name:"name",color:"color",avatar:"avatar",settings:"settings"},
  statuses:{projectId:"project_id",label:"label",color:"color",order:"pos",isDone:"is_done"},
  kinds:{projectId:"project_id",scope:"scope",label:"label",color:"color",icon:"icon",order:"pos"},
  columns:{projectId:"project_id",title:"title",order:"pos",hue:"hue",
           doneMove:"done_move",doneTarget:"done_target",deletedAt:"deleted_at"},
  cards:{projectId:"project_id",columnId:"column_id",parentId:"parent_id",order:"pos",
         title:"title",desc:"descr",done:"done",start:"start_on",due:"due",priority:"priority",
         status:"status",kind:"kind",assignee:"assignee",archived:"archived",
         archivedAt:"archived_at",deletedAt:"deleted_at",createdAt:"created_at",updatedAt:"updated_at"},
  comments:{cardId:"card_id",authorId:"author_id",author:"author",body:"body",createdAt:"created_at"},
  files:{projectId:"project_id",cardId:"card_id",name:"name",size:"size",mime:"mime",
         path:"path",createdAt:"created_at"},
  notes:{projectId:"project_id",title:"title",body:"body",color:"color",kind:"kind",
         order:"pos",createdAt:"created_at",updatedAt:"updated_at"},
  feeds:{userId:"user_id",scope:"scope",createdAt:"created_at"}
};
var NUM={order:1,size:1},TIME={createdAt:1,updatedAt:1,archivedAt:1,deletedAt:1},
    /* ссылки и даты: пустое значение в базе — null */
    NULLABLE={parentId:1,assignee:1,start:1,due:1,doneTarget:1,cardId:1,status:1,userId:1,authorId:1,archivedAt:1,deletedAt:1};
/* что база удаляет вместе со строкой (on delete cascade в supabase-schema.sql) */
var CASCADE={
  projects:[["project_members","projectId"],["statuses","projectId"],["kinds","projectId"],["columns","projectId"],
            ["cards","projectId"],["notes","projectId"],["files","projectId"]],
  columns:[["cards","columnId"]],
  cards:[["cards","parentId"],["comments","cardId"],["files","cardId"]]
};
function cascadeOf(coll,acc){
  acc=acc||{}; acc[coll]=1;
  (CASCADE[coll]||[]).forEach(function(r){if(!acc[r[0]]) cascadeOf(r[0],acc);});
  return acc;
}

function fromRow(coll,r){
  var o={id:r.id},m=MAP[coll];
  Object.keys(m).forEach(function(k){
    var v=r[m[k]];
    o[k]=NUM[k]?Number(v)||0:TIME[k]?(v?Date.parse(v):0):(v==null?"":v);
  });
  return o;
}
function toRow(coll,id,o){
  var r={},m=MAP[coll];
  Object.keys(o).forEach(function(k){
    var v=o[k];
    if(!m[k]) return;                       /* локальные поля вроде data демо-файла в базу не идут */
    if(TIME[k]&&!v&&!NULLABLE[k]) return;   /* пустая дата создания — её поставит база */
    r[m[k]]=TIME[k]?(v?new Date(v).toISOString():null):(v===""&&NULLABLE[k]?null:v);
  });
  if(m.updatedAt) r.updated_at=new Date().toISOString();
  if(id!=null) r.id=id;
  return r;
}
function supaStore(sb){
  var subs={},timers={};
  function refetch(coll){
    clearTimeout(timers[coll]);
    timers[coll]=setTimeout(function(){
      sb.from(coll).select("*").then(function(res){
        if(res.error){flash("Не удалось загрузить данные: "+res.error.message);return;}
        var rows=(res.data||[]).map(function(r){return fromRow(coll,r);});
        (subs[coll]||[]).forEach(function(f){f(rows);});
      });
    },110);
  }
  /* после удаления перечитываем и то, что база удалила вместе со строкой */
  function done(colls){return function(res){
    colls.forEach(refetch);
    if(res&&res.error)throw res.error;};}
  return {
    kind:"supabase",refetch:refetch,sb:sb,
    subscribe:function(coll,cb){(subs[coll]=subs[coll]||[]).push(cb);refetch(coll);
      return function(){subs[coll]=subs[coll].filter(function(f){return f!==cb;});};},
    set:function(coll,id,body){return sb.from(coll).upsert(toRow(coll,id,body)).then(done([coll]));},
    update:function(coll,id,patch){return sb.from(coll).update(toRow(coll,null,patch)).eq("id",id).then(done([coll]));},
    del:function(coll,id){return sb.from(coll).delete().eq("id",id).then(done(Object.keys(cascadeOf(coll))));}
  };
}
/* демо-режим: данные в localStorage браузера */
function localStore(){
  var KEY="grid.board.v4",data=null;
  try{data=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!data||!data.projects) data=starter();
  COLLS.forEach(function(c){if(!data[c])data[c]=[];});
  var subs={};
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data));}
    catch(e){flash("В демо-режиме кончилось место в браузере. Удалите крупные файлы.");}
  }
  function emit(c){(subs[c]||[]).forEach(function(f){f(data[c].slice());});}
  function idx(c,id){for(var i=0;i<data[c].length;i++){if(data[c][i].id===id)return i;}return -1;}
  return {
    kind:"local",refetch:function(){},
    subscribe:function(c,cb){(subs[c]=subs[c]||[]).push(cb);
      setTimeout(function(){cb(data[c].slice());},0);
      return function(){subs[c]=subs[c].filter(function(f){return f!==cb;});};},
    set:function(c,id,body){var i=idx(c,id),rec=Object.assign({},body,{id:id});
      if(i<0)data[c].push(rec);else data[c][i]=rec;save();emit(c);return Promise.resolve();},
    update:function(c,id,patch){var i=idx(c,id);if(i<0)return Promise.resolve();
      data[c][i]=Object.assign({},data[c][i],patch);save();emit(c);return Promise.resolve();},
    del:function(c,id){
      var hit={};
      (function drop(c,id){
        hit[c]=1; data[c]=data[c].filter(function(d){return d.id!==id;});
        (CASCADE[c]||[]).forEach(function(r){
          data[r[0]].filter(function(d){return d[r[1]]===id;}).forEach(function(d){drop(r[0],d.id);});});
      })(c,id);
      save(); Object.keys(hit).forEach(emit); return Promise.resolve();}
  };
}

function w(p){
  if(!p||!p.then) return p;
  return p.catch(function(e){
    var msg=(e&&(e.message||e.hint))||"";
    if(/row-level security|permission|denied|JWT/i.test(msg))
      flash("Нет прав на изменение. Возможно, сессия истекла — обновите страницу.");
    else if(/Failed to fetch|NetworkError/i.test(msg))
      flash("Нет связи с базой. Изменение не сохранено.");
    else flash("Не удалось сохранить"+(msg?": "+msg:"."));

/* ═════════ порядок ═════════ */
function orderBetween(prev,next){
  if(prev==null&&next==null) return 1000;
  if(prev==null) return next-1000;
  if(next==null) return prev+1000;
  return (prev+next)/2;
}
function needsNormalize(a,b){return a!=null&&b!=null&&Math.abs(b-a)<0.0005;}
function normalize(list,coll){
  list.forEach(function(it,i){
    if(it.order!==(i+1)*1000) w(S.store.update(coll,it.id,{order:(i+1)*1000}));
  });
}

/* ═════════ изменения ═════════ */
function patchCard(id,patch){
  var c=card(id); if(c) Object.assign(c,patch);
  w(S.store.update("cards",id,patch));
  renderMain(); if(S.open) renderDrawer();
}
/* Статусы, свои типы и команда у каждого проекта свои. Задача, переехавшая
   в другой проект, получает статус и тип с тем же названием (статуса нет —
   начальный или «выполнено»), а ответственный снимается, если он не участник. */
function carryOver(c,pid){
  var st=statusOf(c.status),k=find(S.kinds,c.kind),patch={};
  var ns=st&&statusList(pid).filter(function(s){return s.label===st.label;})[0]||(c.done?doneStatus(pid):startStatus(pid));
  patch.status=ns?ns.id:"";
  if(k) patch.kind=(kindsFor("task",pid).filter(function(x){return x.projectId&&x.label===k.label;})[0]||{id:""}).id;
  if(c.assignee&&!roleOf(pid,c.assignee)) patch.assignee="";
  return patch;
}
/* файлы переехавших задач переходят в новый проект (комментарии привязаны к задаче и едут сами) */
function moveFiles(cardIds,pid){
  S.files.forEach(function(f){
    if(cardIds.indexOf(f.cardId)<0) return;
    f.projectId=pid; w(S.store.update("files",f.id,{projectId:pid}));
  });
}
/* переносит задачу вместе с подзадачами */
function moveCard(id,colId,order,extra){
  var c=card(id),col=column(colId); if(!c||!col) return;
  var pid=col.projectId,moved=pid!==c.projectId,kids=S.cards.filter(function(x){return x.parentId===id;});
  kids.forEach(function(k){
    if(k.columnId===colId&&!moved) return;
    var p=Object.assign(moved?carryOver(k,pid):{},{columnId:colId,projectId:pid});
    Object.assign(k,p); w(S.store.update("cards",k.id,p));
  });
  var patch=Object.assign({},extra||{},{columnId:colId,projectId:pid,order:order});
  if(moved){
    moveFiles([id].concat(kids.map(function(k){return k.id;})),pid);
    Object.assign(patch,carryOver(Object.assign({},c,extra),pid));
  }
  patchCard(id,patch);
}
/* Куда уезжает выполненная задача: колонка из настроек, иначе следующая.
   null — задача остаётся на месте. */
function doneTarget(col){
  if(!col||col.doneMove===false) return null;
  if(col.doneTarget&&col.doneTarget!==col.id){
    var t=column(col.doneTarget),tp=t&&project(t.projectId);
    if(!t||!tp) return null;                /* проект, куда у вас нет доступа */
    if(!t.deletedAt&&!tp.deletedAt) return canEdit(t.projectId)?t:null;
    /* колонка назначения в корзине — как будто её не выбирали */
  }
  var list=colsOf(col.projectId);
  for(var i=0;i<list.length-1;i++){if(list[i].id===col.id) return list[i+1];}
  return null;
}
/* Отметка «выполнено» переносит задачу по настройке её колонки. Снятие
   отметки задачу не возвращает — возврат был бы неожиданным. Подзадачи
   живут под родителем и никуда не переезжают. */
function toggleDone(id){
  var c=card(id); if(!c) return;
  var next=!c.done,ds=doneStatus(c.projectId),st=c.status;
  if(next&&ds) st=ds.id;
  else if(!next&&ds&&c.status===ds.id){
    /* снятая отметка возвращает задачу «в работу» — на второй статус по списку */
    var open=statusList(c.projectId).filter(function(s){return !s.isDone;});
    st=((open[1]||open[0])||{}).id||"";
  }
  var patch={done:next,status:st};
  var target=next&&!c.parentId?doneTarget(column(c.columnId)):null;
  if(!target){patchCard(id,patch);return;}
  moveCard(id,target.id,endOf(target.id),patch);
  if(target.projectId!==S.project) flash("Задача перенесена в «"+colPath(target)+"»");
}

/* Корзина: удалённые проекты, колонки и задачи лежат в ней 30 дней, потом
   стираются насовсем. Задача уходит туда с подзадачами и возвращается с теми,
   что ушли вместе с ней (у них та же отметка времени). */
var TRASH_DAYS=30;
function trashCard(id){
  var c=card(id); if(!c) return;
  var at=Date.now(),ids=[id];
  S.cards.forEach(function(k){
    if(k.parentId!==id||k.deletedAt) return;
    k.deletedAt=at; ids.push(k.id); w(S.store.update("cards",k.id,{deletedAt:at}));
  });
  if(ids.indexOf(S.open)>=0) closeDrawer();
  patchCard(id,{deletedAt:at});
  flash("Задача в корзине",function(){restoreCard(id);});
}
function restoreCard(id){
  var c=card(id); if(!c) return;
  S.cards.forEach(function(k){
    if(k.parentId!==id||k.deletedAt!==c.deletedAt) return;
    k.deletedAt=0; w(S.store.update("cards",k.id,{deletedAt:0}));
  });
  patchCard(id,{deletedAt:0});
}
/* Насовсем: вложенное удаляет база (в демо — localStore), а файлы из
   хранилища убираем сами — про них база не знает. */
function purge(coll,id){
  var gone=coll==="cards"?S.cards.filter(function(c){return c.id===id||c.parentId===id;})
    :coll==="columns"?S.cards.filter(function(c){return c.columnId===id;}):[];
  removeObjects(S.files.filter(function(f){
    return coll==="projects"?f.projectId===id:gone.some(function(c){return c.id===f.cardId;});}));
  w(S.store.del(coll,id));
}
/* при входе владелец стирает то, что пролежало в корзине дольше срока */
function purgeOld(){
  var edge=Date.now()-TRASH_DAYS*864e5,old=function(x){return x.deletedAt&&x.deletedAt<edge;};
  S.projects.forEach(function(p){if(old(p)&&isOwner(p.id)) purge("projects",p.id);});
  S.columns.forEach(function(c){if(old(c)&&isOwner(c.projectId)) purge("columns",c.id);});
  S.cards.forEach(function(c){if(old(c)&&isOwner(c.projectId)) purge("cards",c.id);});
}
/* в архив задача уходит вместе с подзадачами и возвращается в конец своей колонки */
function setArchived(id,on){

  S.cards.forEach(function(k){
    if(k.parentId!==id||!!k.archived===on) return;
    k.archived=on; w(S.store.update("cards",k.id,{archived:on}));
  });
  patchCard(id,on?{archived:true,archivedAt:Date.now()}:{archived:false,order:endOf(c.columnId)});
}

function detachCard(id){

function patchColumn(id,patch){

  renderMain();
}
/* колонка уходит в корзину целиком, с задачами и архивом; это может только владелец */
function removeColumn(id){
  var col=column(id); if(!col) return;
  patchColumn(id,{deletedAt:Date.now()});
