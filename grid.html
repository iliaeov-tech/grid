<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Grid — командные Kanban-доски: проекты, неограниченные колонки, подзадачи, дедлайны, Гант, календарь, файлы и комментарии.">
<title>Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Unbounded:wght@600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="grid.config.js"></script>
<style>
/* ───────────────── светлая пастельная тема ───────────────── */
:root{
  color-scheme:light;
  --ground:#F6F7FB;
  --track:#EDEFF6;
  --surface:#FFFFFF;
  --surface-2:#FAFBFD;
  --ink:#212639;
  --ink-2:#5C6479;
  --ink-3:#939BB0;
  --line:#E5E8F1;
  --line-2:#D2D7E6;

  --accent:#00937F;            /* фирменный цвет логотипа — не меняем */
  --accent-hov:#007D6C;
  --accent-soft:#DDF1ED;
  --accent-ink:#FFFFFF;

  --p-low:#7B8AAD;    --p-low-soft:#EAEEF7;
  --p-med:#B4831F;    --p-med-soft:#FAF1DA;
  --p-high:#CC6229;   --p-high-soft:#FBEADD;
  --p-urgent:#C93A50; --p-urgent-soft:#FBE2E6;

  --danger:#C93A50;   --danger-soft:#FBE2E6;
  --warn:#B4831F;

  --h-green:#DEF3E4;  --h-green-ink:#2C6B41;
  --h-yellow:#FBF1D2; --h-yellow-ink:#7C5C13;
  --h-red:#FBE1E1;    --h-red-ink:#8F3036;
  --h-purple:#EBE5FA; --h-purple-ink:#583D8F;
  --h-blue:#DFEAFB;   --h-blue-ink:#2C5480;
  --h-orange:#FCE7D6; --h-orange-ink:#8B4B21;
  --h-teal:#D7F0EC;   --h-teal-ink:#206C61;
  --h-pink:#FBE1EE;   --h-pink-ink:#8D3265;

  --sh-1:0 1px 2px rgba(33,38,57,.05), 0 2px 8px rgba(33,38,57,.045);
  --sh-2:0 2px 6px rgba(33,38,57,.07), 0 12px 28px rgba(33,38,57,.09);
  --sh-drag:0 14px 34px rgba(33,38,57,.20);
  --focus:0 0 0 2px var(--surface), 0 0 0 4px var(--accent);

  --r-s:6px; --r-m:10px; --r-l:14px;
  --f-ui:"Golos Text","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-dis:"Unbounded","Golos Text","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Mono",ui-monospace,monospace;
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
img{max-width:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-ui);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-s)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ───────────────── каркас ───────────────── */
.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.rail{display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);
  position:relative;z-index:30}
.mark{font-family:var(--f-dis);font-weight:600;font-size:15px;letter-spacing:-.02em;
  color:var(--accent);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
  padding:4px 8px;border-radius:var(--r-s);border:1px solid transparent}
.mark:hover{border-color:var(--line-2);background:var(--ground)}
.mark::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--accent)}
.rail-sep{width:1px;height:22px;background:var(--line-2);flex:none}

.b-title{font-size:16px;font-weight:600;letter-spacing:-.01em;padding:3px 8px;
  border-radius:var(--r-s);border:1px solid transparent;max-width:30ch;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.b-title:hover{border-color:var(--line-2);background:var(--ground)}
.b-title-in{font-size:16px;font-weight:600;padding:3px 8px;border-radius:var(--r-s);
  border:1px solid var(--accent);background:var(--surface);width:26ch}

.tally{display:flex;align-items:center;gap:9px;color:var(--ink-3);font-size:12px}
.tally .bar{width:60px;height:5px;border-radius:99px;background:var(--line-2);overflow:hidden}
.tally .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

.rail-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.search{position:relative}
.search input{width:180px;padding:7px 11px 7px 30px;border-radius:99px;
  border:1px solid var(--line-2);background:var(--surface);transition:border-color .15s}
.search input:focus{border-color:var(--accent);outline:none;box-shadow:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:2}
select.pick{padding:7px 10px;border-radius:99px;border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer;max-width:170px}
.toggle{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);
  font-size:13px;white-space:nowrap;transition:all .15s}
.toggle[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.toggle .dot{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.toggle[aria-pressed="true"] .dot{background:var(--accent)}

.here{display:flex;align-items:center;gap:8px}
.here-lbl{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.07em;
  font-weight:500;white-space:nowrap}
.stack{display:flex}
.stack .av{margin-left:-7px;border:2px solid var(--surface)}
.stack .av:first-child{margin-left:0}
.av{width:27px;height:27px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:11px;font-weight:600;color:#fff;background:var(--ink-3);text-transform:uppercase}
.av.sm{width:22px;height:22px;font-size:10px}
.av.ghost{background:transparent;color:var(--ink-3);border:1px dashed var(--line-2)}
.me-btn{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;
  border-radius:99px;border:1px solid var(--line-2);background:var(--surface);
  font-size:13px;font-weight:500;max-width:160px}
.me-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me-btn:hover{border-color:var(--accent)}

.icon-btn{width:32px;height:32px;border-radius:var(--r-s);display:grid;place-items:center;
  color:var(--ink-2);border:1px solid transparent;transition:all .15s;flex:none}
.icon-btn:hover{background:var(--ground);border-color:var(--line-2);color:var(--ink)}
.icon-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.notice{display:flex;align-items:center;gap:9px;padding:7px 16px;font-size:12.5px;
  background:var(--p-med-soft);color:var(--warn);border-bottom:1px solid var(--line)}
.notice b{font-weight:600}

/* ───────────────── вкладки ───────────────── */
.tabs{display:flex;align-items:center;gap:2px;padding:0 16px;background:var(--surface);
  border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;font-size:13px;
  font-weight:500;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap;
  transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink-2)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tab .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}

.main{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}

/* ───────────────── доска ───────────────── */
.board{flex:1;min-height:0;display:flex;align-items:stretch;gap:12px;
  padding:14px 16px 16px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}
.track{flex:0 0 306px;min-height:0;display:flex;flex-direction:column;
  background:var(--track);border-radius:var(--r-l);overflow:hidden}
.track.drag-src{opacity:.35}
.track-head{display:flex;align-items:center;gap:8px;padding:11px 8px 10px 12px;
  background:var(--line);color:var(--ink);cursor:grab;user-select:none;flex:none;
  touch-action:none}
.track-head:active{cursor:grabbing}
.track-head[data-hue="green"] {background:var(--h-green); color:var(--h-green-ink)}
.track-head[data-hue="yellow"]{background:var(--h-yellow);color:var(--h-yellow-ink)}
.track-head[data-hue="red"]   {background:var(--h-red);   color:var(--h-red-ink)}
.track-head[data-hue="purple"]{background:var(--h-purple);color:var(--h-purple-ink)}
.track-head[data-hue="blue"]  {background:var(--h-blue);  color:var(--h-blue-ink)}
.track-head[data-hue="orange"]{background:var(--h-orange);color:var(--h-orange-ink)}
.track-head[data-hue="teal"]  {background:var(--h-teal);  color:var(--h-teal-ink)}
.track-head[data-hue="pink"]  {background:var(--h-pink);  color:var(--h-pink-ink)}
.grip{width:9px;height:14px;flex:none;opacity:.4;
  background-image:radial-gradient(circle,currentColor 1.1px,transparent 1.2px);
  background-size:4.5px 4.5px}
.track-name{font-weight:600;font-size:13.5px;flex:1;min-width:0;color:inherit;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;
  padding:2px 4px;border-radius:4px;border:1px solid transparent;cursor:text}
.track-name:hover{border-color:currentColor}
.track-name-in{flex:1;min-width:0;font-weight:600;font-size:13.5px;padding:2px 5px;
  border-radius:4px;border:1px solid var(--accent);background:var(--surface);color:var(--ink)}
.track-count{font-size:11.5px;flex:none;padding:1px 6px;border-radius:99px;
  background:rgba(255,255,255,.6);color:inherit}
.track-body{flex:1;min-height:44px;overflow-y:auto;overflow-x:hidden;padding:8px;
  display:flex;flex-direction:column;gap:8px;scrollbar-width:thin}
.track-body.hot{background:var(--accent-soft)}

/* «+ Задача» живёт внутри списка, сразу под последней карточкой */
.add-card{padding:7px 8px;border-radius:var(--r-m);color:var(--ink-3);flex:none;
  font-size:13px;text-align:left;display:flex;align-items:center;gap:7px;transition:all .15s}
.add-card:hover{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.add-track{flex:0 0 240px;align-self:flex-start;border:1.5px dashed var(--line-2);
  border-radius:var(--r-l);padding:14px;color:var(--ink-3);font-size:13.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
.add-track:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ───────────────── карточка ───────────────── */
.card{position:relative;background:var(--surface);border-radius:var(--r-m);
  padding:10px 11px 9px 15px;box-shadow:var(--sh-1);cursor:pointer;flex:none;
  display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.card:hover{box-shadow:var(--sh-2)}
.card::before{content:"";position:absolute;left:5px;top:10px;bottom:10px;width:3px;
  border-radius:99px;background:var(--pc,var(--line-2))}
.card.is-done{background:var(--surface-2)}
.card.is-done::before{background:var(--line-2)}
.card.drag-src{opacity:.32}
.card-top{display:flex;align-items:flex-start;gap:9px}
.check{width:17px;height:17px;flex:none;margin-top:1px;border-radius:5px;
  border:1.6px solid var(--line-2);background:var(--surface);display:grid;place-items:center;
  transition:all .15s;padding:0}
.check:hover{border-color:var(--accent)}
.check svg{width:11px;height:11px;stroke:var(--accent-ink);fill:none;stroke-width:2.6;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] svg{opacity:1}
.c-title{font-size:13.5px;line-height:1.4;font-weight:500;word-break:break-word;flex:1}
.is-done .c-title{text-decoration:line-through;text-decoration-thickness:1.5px;
  text-decoration-color:var(--ink-3);color:var(--ink-3);font-weight:400}

.chips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
/* чип не сжимаем: иначе узкий счётчик схлопывается и разъезжается на две строки */
.chips>.chip{flex:0 0 auto}
.chip{display:inline-flex;flex-wrap:nowrap;align-items:center;gap:5px;padding:2px 7px;
  border-radius:5px;font-size:11.5px;font-weight:500;background:var(--ground);
  color:var(--ink-2);white-space:nowrap;line-height:1.5;max-width:100%}
.chip .pip{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.chip.prio{color:var(--pc)}
.chip.prio.loud{background:var(--pcs)}
.chip.due{font-family:var(--f-mono);font-size:11px}
.chip.due.soon{background:var(--p-med-soft);color:var(--warn)}
.chip.due.late{background:var(--danger-soft);color:var(--danger)}
/* имя badge выбрано намеренно: subs и talk заняты блоками подзадач и комментариев */
.chip.badge{font-family:var(--f-mono);font-size:11px}
.chip.kind{background:var(--accent-soft);color:var(--accent);
  overflow:hidden;text-overflow:ellipsis}
.chip svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;flex:none}
.card-foot{display:flex;align-items:center;gap:9px}
.mini-bar{flex:1;height:3px;border-radius:99px;background:var(--line);overflow:hidden}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

.composer{background:var(--surface);border-radius:var(--r-m);box-shadow:var(--sh-2);
  padding:9px;display:flex;flex-direction:column;gap:8px;flex:none}
.composer textarea{width:100%;resize:none;border:none;background:none;font-size:13.5px;
  line-height:1.4;min-height:44px;outline:none;font-family:inherit}
.composer .row{display:flex;gap:6px;align-items:center}
.btn{padding:6px 13px;border-radius:var(--r-s);font-size:13px;font-weight:500;
  background:var(--accent);color:var(--accent-ink);transition:background .15s}
.btn:hover{background:var(--accent-hov)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--ground);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.hint{font-size:11px;color:var(--ink-3);margin-left:auto;font-family:var(--f-mono)}

.empty{margin:auto;text-align:center;padding:40px 20px;max-width:46ch}
.empty h2{font-family:var(--f-dis);font-weight:600;font-size:21px;margin:0 0 10px;
  letter-spacing:-.02em;text-wrap:balance}
.empty p{color:var(--ink-2);margin:0 0 20px}
.skeleton{margin:auto;color:var(--ink-3);font-size:13px;display:flex;align-items:center;gap:10px}
.spin{width:14px;height:14px;border:2px solid var(--line-2);border-top-color:var(--accent);
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ───────────────── Гант ───────────────── */
.pane{flex:1;min-height:0;overflow:auto;padding:16px}
.gantt{min-width:max-content;font-size:12.5px}
.g-row{display:grid;width:max-content;align-items:center;border-bottom:1px solid var(--line)}
.g-row.head{position:sticky;top:0;z-index:2;background:var(--ground);
  border-bottom:1px solid var(--line-2)}
/* каждый элемент строки размещаем явно: при смешении явных и авто-ячеек
   grid уводил название задачи во вторую строку */
.g-name{grid-column:1;grid-row:1;padding:7px 10px 7px 0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;position:sticky;left:0;
  background:var(--ground);z-index:3;display:flex;align-items:center;gap:7px}
.g-row.head .g-name{font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:600}
.g-name .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--pc)}
.g-name.done{color:var(--ink-3);text-decoration:line-through}
.g-day{grid-row:1;text-align:center;font-family:var(--f-mono);font-size:10.5px;
  color:var(--ink-3);padding:6px 0;border-left:1px solid var(--line);line-height:1.3}
.g-day.we{background:var(--track)}
.g-day.today{background:var(--accent-soft);color:var(--accent);font-weight:500}
.g-cell{height:34px;border-left:1px solid var(--line);grid-row:1}
.g-cell.we{background:var(--track)}
.g-cell.today{background:var(--accent-soft)}
.g-bar{grid-row:1;height:19px;border-radius:99px;background:var(--pc);align-self:center;
  margin:0 2px;display:flex;align-items:center;padding:0 8px;color:#fff;font-size:11px;
  font-weight:500;overflow:hidden;white-space:nowrap;z-index:1}
.g-bar.done{background:var(--line-2);color:var(--ink-2)}
.g-mon{grid-row:1;padding:4px 0 4px 5px;font-size:11px;font-weight:600;color:var(--ink-2);
  border-left:1px solid var(--line-2);text-transform:capitalize;overflow:hidden;white-space:nowrap}

/* ───────────────── календарь ───────────────── */
.cal{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.cal-day{display:grid;grid-template-columns:104px 1fr;gap:16px;align-items:start}
.cal-when{padding-top:2px}
.cal-when .d{font-family:var(--f-dis);font-size:20px;font-weight:600;letter-spacing:-.02em;
  line-height:1.1}
.cal-when .m{font-size:12px;color:var(--ink-3);text-transform:capitalize}
.cal-when.late .d{color:var(--danger)}
.cal-when.today .d{color:var(--accent)}
.cal-list{display:flex;flex-direction:column;gap:4px}
.cal-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--sh-1);cursor:pointer}
.cal-item:hover{box-shadow:var(--sh-2)}
.cal-item .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--pc)}
.cal-item .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-item.done .t{text-decoration:line-through;color:var(--ink-3)}
.cal-item .meta{font-size:11.5px;color:var(--ink-3);white-space:nowrap}

/* ───────────────── заметки и файлы ───────────────── */
.notes{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.sect-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.sect-h h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:0}
.sect-h .n{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.sect-h .bar{flex:1;height:4px;border-radius:99px;background:var(--line);overflow:hidden;max-width:110px}
.sect-h .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.sect-h .sp{flex:1}
.note-area{width:100%;min-height:190px;resize:vertical;padding:13px 15px;
  border-radius:var(--r-l);border:1px solid var(--line-2);background:var(--surface);
  font-size:14px;line-height:1.6;outline:none;font-family:inherit}
.note-area:focus{border-color:var(--accent)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-m);
  background:var(--surface);box-shadow:var(--sh-1)}
.file .ic{width:30px;height:30px;border-radius:8px;background:var(--accent-soft);
  color:var(--accent);display:grid;place-items:center;flex:none}
.file .ic svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.file .nm{flex:1;min-width:0}
.file .nm b{display:block;font-weight:500;font-size:13.5px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.file .nm span{font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono)}
.file .x{color:var(--ink-3);width:26px;height:26px;border-radius:5px;display:grid;
  place-items:center;flex:none}
.file .x:hover{background:var(--danger-soft);color:var(--danger)}
.file .x svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.drop-hint{font-size:12.5px;color:var(--ink-3);padding:12px;text-align:center;
  border:1.5px dashed var(--line-2);border-radius:var(--r-m)}

/* ───────────────── панель задачи ───────────────── */
.scrim{position:fixed;inset:0;background:rgba(33,38,57,.28);z-index:40;
  opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:50;
  background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-2);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.32,.72,.3,1);
  display:flex;flex-direction:column}
.drawer.on{transform:none}
.d-head{display:flex;align-items:center;gap:8px;padding:12px 12px 12px 16px;
  border-bottom:1px solid var(--line);flex:none}
.d-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.d-title-row{display:flex;gap:11px;align-items:flex-start}
.d-title{flex:1;font-size:18px;font-weight:600;line-height:1.3;letter-spacing:-.01em;
  border:1px solid transparent;border-radius:var(--r-s);padding:4px 6px;resize:none;
  background:none;width:100%;overflow:hidden;font-family:inherit}
.d-title:hover{border-color:var(--line)}
.d-title:focus{border-color:var(--accent);outline:none;background:var(--ground)}
.d-title.done{text-decoration:line-through;text-decoration-color:var(--ink-3);color:var(--ink-3)}

.fields{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;align-items:center}
.fields .lbl{font-size:12px;color:var(--ink-3);font-weight:500}
.fields .ctl{min-width:0}
.fields select,.fields input[type="date"],.fields input[type="text"]{width:100%;
  padding:6px 9px;border-radius:var(--r-s);border:1px solid var(--line-2);
  background:var(--surface);cursor:pointer}
.fields select:focus,.fields input:focus{border-color:var(--accent);outline:none}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{padding:5px 9px;border-radius:var(--r-s);font-size:12px;font-weight:500;
  border:1px solid var(--line-2);color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button .pip{width:6px;height:6px;border-radius:50%;background:var(--pc)}
.seg button[aria-pressed="true"]{background:var(--pcs);border-color:var(--pc);color:var(--pc)}
.seg.kinds button svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.seg.kinds button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.subs{display:flex;flex-direction:column;gap:2px}
.sub{display:flex;align-items:flex-start;gap:9px;padding:5px 6px;border-radius:var(--r-s)}
.sub:hover{background:var(--ground)}
.sub .txt{flex:1;font-size:13.5px;line-height:1.4;word-break:break-word}
.sub.done .txt{text-decoration:line-through;color:var(--ink-3)}
.sub .x{opacity:0;color:var(--ink-3);width:20px;height:20px;border-radius:4px;
  display:grid;place-items:center;flex:none}
.sub:hover .x{opacity:1}
.sub .x:hover{background:var(--danger-soft);color:var(--danger)}
.sub .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sub-add{display:flex;align-items:center;gap:9px;padding:5px 6px}
.sub-add input{flex:1;border:none;background:none;outline:none;font-size:13.5px;
  border-bottom:1px solid transparent;padding:2px 0}
.sub-add input:focus{border-bottom-color:var(--accent)}

.d-desc{width:100%;min-height:82px;resize:vertical;padding:9px 10px;border-radius:var(--r-m);
  border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;line-height:1.5;
  font-family:inherit}
.d-desc:focus{border-color:var(--accent);outline:none}

.talk{display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px}
.msg .body{flex:1;min-width:0}
.msg .who{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.msg .who b{font-size:12.5px;font-weight:600}
.msg .who time{font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}
.msg .txt{font-size:13.5px;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.msg .x{opacity:0;color:var(--ink-3);width:20px;height:20px;border-radius:4px;
  display:grid;place-items:center;flex:none;align-self:flex-start}
.msg:hover .x{opacity:1}
.msg .x:hover{background:var(--danger-soft);color:var(--danger)}
.msg .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.talk-add{display:flex;gap:8px;align-items:flex-end}
.talk-add textarea{flex:1;min-height:38px;max-height:130px;resize:none;padding:8px 10px;
  border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);
  font-size:13.5px;line-height:1.45;outline:none;font-family:inherit}
.talk-add textarea:focus{border-color:var(--accent)}

.d-foot{padding:11px 16px;border-top:1px solid var(--line);display:flex;align-items:center;
  gap:10px;flex:none}
.d-foot .stamp{margin-left:auto;font-size:11px;color:var(--ink-3);font-family:var(--f-mono)}

/* ───────────────── всплывающие панели ───────────────── */
.sheet{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l);box-shadow:var(--sh-2);width:306px;padding:12px;
  display:flex;flex-direction:column;gap:4px;max-height:72vh;overflow-y:auto}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
  font-weight:600;margin:0 0 6px}
.sheet .note{font-size:11.5px;color:var(--ink-3);line-height:1.45;margin:0 0 8px}
.mrow{display:flex;align-items:center;gap:9px;padding:5px;border-radius:var(--r-s)}
.mrow:hover{background:var(--ground)}
.mrow input{flex:1;min-width:0;border:none;background:none;outline:none;font-size:13.5px;
  border-bottom:1px solid transparent;padding:2px 0}
.mrow input:focus{border-bottom-color:var(--accent)}
.mrow.pickable{cursor:pointer}
.mrow.on{background:var(--accent-soft)}
.mrow .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);flex:none}
.mrow .x{opacity:0;color:var(--ink-3);width:22px;height:22px;border-radius:4px;
  display:grid;place-items:center;flex:none}
.mrow:hover .x{opacity:1}
.mrow .x:hover{background:var(--danger-soft);color:var(--danger)}
.mrow .x svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sheet-add{display:flex;gap:6px;margin-top:8px;padding-top:9px;border-top:1px solid var(--line)}
.sheet-add input{flex:1;min-width:0;padding:6px 9px;border-radius:var(--r-s);
  border:1px solid var(--line-2);background:var(--surface);outline:none}
.sheet-add input:focus{border-color:var(--accent)}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-bottom:4px}
.sw{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:var(--r-s);
  font-size:12px;font-weight:500;border:1px solid transparent;text-align:left}
.sw .b{width:13px;height:13px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.07)}
.sw[aria-pressed="true"]{border-color:var(--accent)}
.sw:hover{background:var(--ground)}

.drag-ghost{position:fixed;z-index:90;pointer-events:none;box-shadow:var(--sh-drag);
  transform:rotate(1.6deg);opacity:.96;border-radius:var(--r-m)}
.drag-ghost.col{border-radius:var(--r-l);transform:rotate(.8deg)}
.slot{border-radius:var(--r-m);background:var(--accent-soft);
  border:1.5px dashed var(--accent);flex:none}
.slot.col{border-radius:var(--r-l);align-self:stretch}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:95;
  background:var(--ink);color:#fff;padding:9px 16px;border-radius:99px;
  font-size:13px;box-shadow:var(--sh-2);max-width:80vw}

/* ───────────────── вход ───────────────── */
.gate{position:fixed;inset:0;z-index:80;background:var(--ground);
  display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto}
.gate-box{width:100%;max-width:392px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--sh-2);padding:26px}
.gate-mark{font-family:var(--f-dis);font-weight:600;font-size:19px;color:var(--accent);
  letter-spacing:-.02em;margin-bottom:18px}
.gate h1{font-size:19px;font-weight:600;letter-spacing:-.015em;margin:0 0 8px;text-wrap:balance}
.gate p{color:var(--ink-2);font-size:13.5px;line-height:1.55;margin:0 0 18px}
.gate p.small{font-size:12.5px;color:var(--ink-3);margin:14px 0 0}
.gate label{display:block;font-size:12px;font-weight:500;color:var(--ink-3);margin:0 0 5px}
.gate .fld{margin-bottom:13px}
.gate input{width:100%;padding:9px 11px;border-radius:var(--r-m);border:1px solid var(--line-2);
  background:var(--surface);outline:none;font-size:13.5px}
.gate input:focus{border-color:var(--accent)}
.gate .btn{display:block;width:100%;padding:10px;text-align:center;font-size:14px}
.gate .btn.ghost,.sheet .btn.ghost{background:transparent;color:var(--ink-2);
  border:1px solid var(--line-2)}
.gate .btn.ghost{margin-top:9px}
.gate .btn.ghost:hover,.sheet .btn.ghost:hover{color:var(--ink);border-color:var(--ink-3)}
.gate .msg{font-size:12.5px;padding:9px 11px;border-radius:var(--r-m);margin-bottom:14px;line-height:1.5}
.gate .msg.ok{background:var(--accent-soft);color:var(--accent)}
.gate .msg.bad{background:var(--danger-soft);color:var(--danger)}
.gate code{font-family:var(--f-mono);font-size:12px;background:var(--ground);
  padding:1px 5px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>

<div class="app">
  <header class="rail">
    <button class="mark" id="btnProjects" title="Все проекты">Grid</button>
    <span class="rail-sep"></span>
    <button class="b-title" id="boardTitle" title="Переименовать проект">Проект</button>
    <div class="tally" id="tally"></div>

    <div class="rail-right">
      <div class="here" id="here" hidden>
        <span class="here-lbl">на доске</span>
        <div class="stack" id="stack"></div>
      </div>
      <div class="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Поиск задач" aria-label="Поиск задач">
      </div>
      <select class="pick" id="fAssignee" aria-label="Фильтр по ответственному"></select>
      <select class="pick" id="fPriority" aria-label="Фильтр по приоритету"></select>
      <button class="toggle" id="fDone" aria-pressed="false"><span class="dot"></span>Скрыть выполненные</button>
      <span class="rail-sep"></span>
      <button class="icon-btn" id="btnMembers" title="Участники" aria-label="Участники">
        <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"></circle><path d="M3.5 19c0-3.1 2.5-5 5.5-5s5.5 1.9 5.5 5"></path><path d="M16 5.5a3 3 0 0 1 0 5.6"></path><path d="M17.5 14.2c2 .6 3.5 2.2 3.5 4.8"></path></svg>
      </button>
      <button class="me-btn" id="btnMe"></button>
    </div>
  </header>

  <div class="notice" id="notice" hidden></div>

  <nav class="tabs" id="tabs" role="tablist"></nav>

  <main class="main" id="main">
    <div class="skeleton"><span class="spin"></span>Подключаемся к доске…</div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="Детали задачи"></aside>
<div class="gate" id="gate" hidden></div>
<input type="file" id="filePick" hidden>

<script>
(function(){
"use strict";

/* ═════════ утилиты ═════════ */
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});};
var uid=function(p){return p+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);};
var clamp=function(n,a,b){return Math.max(a,Math.min(b,n));};

var PRIOS=[{id:"low",label:"Низкий"},{id:"med",label:"Средний"},
           {id:"high",label:"Высокий"},{id:"urgent",label:"Срочно"}];
var STATUSES=[{id:"todo",label:"Не начата"},{id:"doing",label:"В работе"},
              {id:"blocked",label:"Нужна помощь"},{id:"review",label:"На проверке"},
              {id:"done",label:"Готова"}];
var KINDS=[{id:"report",label:"Отчёты"},{id:"learn",label:"Обучение"},
           {id:"improve",label:"Улучшайзинг"},{id:"idea",label:"Идея"},
           {id:"note",label:"Заметка"},{id:"urgent",label:"Срочно"},
           {id:"other",label:"Другое"}];
var HUES=[{id:"",label:"Без цвета"},{id:"green",label:"Зелёный"},{id:"yellow",label:"Жёлтый"},
          {id:"red",label:"Красный"},{id:"purple",label:"Фиолетовый"},{id:"blue",label:"Синий"},
          {id:"orange",label:"Оранжевый"},{id:"teal",label:"Бирюзовый"},{id:"pink",label:"Розовый"}];
var PALETTE=["#E0653F","#2F8FD4","#7B5BD6","#B9861A","#0E9E86","#D6467F","#5C7CFA","#3F9A4A"];

var KIND_PATH={
  report:'<path d="M6 3h8l4 4v14H6z"></path><path d="M14 3v4h4"></path><path d="M9 13h6M9 17h4"></path>',
  learn:'<path d="M12 4L2.5 9 12 14l9.5-5z"></path><path d="M6 11.5V17c0 1.4 2.7 3 6 3s6-1.6 6-3v-5.5"></path>',
  improve:'<path d="M3 17l5.5-5.5 3.5 3.5L21 6"></path><path d="M15 6h6v6"></path>',
  idea:'<path d="M9 18h6"></path><path d="M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8 1 .8 1.6v.5h5.4v-.5c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3z"></path>',
  note:'<path d="M5 4h14v10l-5 5H5z"></path><path d="M19 14h-5v5"></path><path d="M8.5 8.5h7M8.5 12h4"></path>',
  urgent:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"></path>',
  other:'<circle cx="6" cy="12" r="1.4"></circle><circle cx="12" cy="12" r="1.4"></circle><circle cx="18" cy="12" r="1.4"></circle>'
};
function kindIcon(id){return '<svg viewBox="0 0 24 24">'+(KIND_PATH[id]||KIND_PATH.other)+"</svg>";}
function kindLabel(c){
  if(!c.kind) return "";
  if(c.kind==="other") return (c.kindOther||"").trim()||"Другое";
  return labelOf(KINDS,c.kind,"");
}
function prioVar(p){return "var(--p-"+p+")";}
function prioSoft(p){return "var(--p-"+p+"-soft)";}
function labelOf(list,id,dflt){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i].label;}return dflt||"";}

var MONTHS=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
var MONTHS_FULL=["январь","февраль","март","апрель","май","июнь","июль",
                 "август","сентябрь","октябрь","ноябрь","декабрь"];
var WEEK=["вс","пн","вт","ср","чт","пт","сб"];
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function todayISO(){return iso(new Date());}
function parseISO(s){var p=String(s||"").split("-");
  return p.length===3&&p[0]?new Date(+p[0],+p[1]-1,+p[2]):null;}
function daysBetween(a,b){return Math.round((b-a)/864e5);}
function dueInfo(s){
  var d=parseISO(s); if(!d) return null;
  var n=daysBetween(parseISO(todayISO()),d);
  var label=n===0?"сегодня":n===1?"завтра":n===-1?"вчера":
    d.getDate()+" "+MONTHS[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?" "+String(d.getFullYear()).slice(2):"");
  return {label:label,days:n,state:n<0?"late":(n<=2?"soon":"")};
}
function initials(name){
  var p=String(name||"?").trim().split(/\s+/).filter(Boolean);
  return p.length?(p[0][0]+(p[1]?p[1][0]:"")).toUpperCase():"?";
}
function fmtSize(n){
  n=Number(n)||0;
  return n<1024?n+" Б":n<1048576?(n/1024).toFixed(0)+" КБ":(n/1048576).toFixed(1)+" МБ";
}
function fmtWhen(ts){
  if(!ts) return "";
  var d=new Date(ts),n=new Date();
  var hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");
  return d.toDateString()===n.toDateString()?hm:(d.getDate()+" "+MONTHS[d.getMonth()]+", "+hm);
}

/* ═════════ состояние ═════════ */
var S={store:null,sb:null,chan:null,mode:"boot",started:false,
  projects:[],columns:[],cards:[],members:[],comments:[],files:[],notes:[],
  project:null,tab:"board",me:null,open:null,peers:[],
  filter:{q:"",assignee:"all",priority:"all",hideDone:false},
  composer:null,composerText:"",renaming:null,
  dragging:false};

var mainEl=$("#main"),drawerEl=$("#drawer"),scrimEl=$("#scrim"),
    gateEl=$("#gate"),tabsEl=$("#tabs"),filePick=$("#filePick");

/* ═════════ выборки ═════════ */
function find(list,id){for(var i=0;i<list.length;i++){if(list[i].id===id)return list[i];}return null;}
function project(id){return find(S.projects,id||S.project);}
function member(id){return find(S.members,id);}
function column(id){return find(S.columns,id);}
function card(id){return find(S.cards,id);}
function byOrder(a,b){return (a.order||0)-(b.order||0)||String(a.id).localeCompare(String(b.id));}
function projName(){var p=project();return p?p.name:"Проект";}
function cols(){return S.columns.filter(function(c){return c.projectId===S.project;}).sort(byOrder);}
function projCards(){return S.cards.filter(function(c){return c.projectId===S.project;});}
function cardsIn(colId){return S.cards.filter(function(c){return c.columnId===colId;}).sort(byOrder);}
function commentsOf(id){return S.comments.filter(function(c){return c.cardId===id;})
  .sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});}
function filesOf(id){return S.files.filter(function(f){return f.cardId===id;})
  .sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0);});}
function projFiles(){return S.files.filter(function(f){return f.projectId===S.project;})
  .sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0);});}
function passes(c){
  var f=S.filter;
  if(f.hideDone&&c.done) return false;
  if(f.assignee!=="all"&&(c.assignee||"")!==(f.assignee==="none"?"":f.assignee)) return false;
  if(f.priority!=="all"&&(c.priority||"med")!==f.priority) return false;
  if(f.q){
    var q=f.q.toLowerCase();
    var hay=(c.title||"")+" "+(c.desc||"")+" "+kindLabel(c)+" "+
      (c.subtasks||[]).map(function(s){return s.text;}).join(" ");
    if(hay.toLowerCase().indexOf(q)<0) return false;
  }
  return true;
}
function visibleIn(colId){return cardsIn(colId).filter(passes);}
function meName(){var m=S.me?member(S.me):null;return m?m.name:"Гость";}

/* ═════════ уведомления ═════════ */
var toastT;
function flash(msg){
  var el=$("#toast");
  if(!el){el=document.createElement("div");el.id="toast";el.className="toast";document.body.appendChild(el);}
  el.textContent=msg; el.style.display="block";
  clearTimeout(toastT); toastT=setTimeout(function(){el.style.display="none";},3600);
}

/* ═════════ хранилище ═════════ */
var COLLS=["projects","columns","cards","members","comments","files","notes"];
var TABLES={projects:"projects",columns:"columns",cards:"cards",members:"members",
            comments:"comments",files:"files",notes:"notes"};

function fromRow(coll,r){
  if(coll==="cards") return {id:r.id,projectId:r.project_id,columnId:r.column_id,
    order:Number(r.pos)||0,title:r.title||"",desc:r.descr||"",done:!!r.done,
    start:r.start_on||"",due:r.due||"",priority:r.priority||"med",status:r.status||"todo",
    kind:r.kind||"",kindOther:r.kind_other||"",assignee:r.assignee||"",
    subtasks:Array.isArray(r.subtasks)?r.subtasks:[],
    updatedAt:r.updated_at?Date.parse(r.updated_at):0};
  if(coll==="columns") return {id:r.id,projectId:r.project_id,title:r.title||"",
    order:Number(r.pos)||0,hue:r.hue||""};
  if(coll==="projects") return {id:r.id,name:r.name||"",order:Number(r.pos)||0};
  if(coll==="members") return {id:r.id,name:r.name||"",color:r.color||"#7F8C8D"};
  if(coll==="comments") return {id:r.id,cardId:r.card_id,author:r.author||"",
    body:r.body||"",createdAt:r.created_at?Date.parse(r.created_at):0};
  if(coll==="files") return {id:r.id,projectId:r.project_id,cardId:r.card_id||"",
    name:r.name||"",size:Number(r.size)||0,mime:r.mime||"",path:r.path||"",data:r.data||"",
    createdAt:r.created_at?Date.parse(r.created_at):0};
  return {id:r.id,projectId:r.project_id,body:r.body||"",
    updatedAt:r.updated_at?Date.parse(r.updated_at):0};
}
function toRow(coll,id,o){
  var r={},has=function(k){return Object.prototype.hasOwnProperty.call(o,k);};
  if(coll==="cards"){
    if(has("projectId"))r.project_id=o.projectId; if(has("columnId"))r.column_id=o.columnId;
    if(has("order"))r.pos=o.order;               if(has("title"))r.title=o.title;
    if(has("desc"))r.descr=o.desc;               if(has("done"))r.done=!!o.done;
    if(has("start"))r.start_on=o.start||null;    if(has("due"))r.due=o.due||null;
    if(has("priority"))r.priority=o.priority;    if(has("status"))r.status=o.status;
    if(has("kind"))r.kind=o.kind||null;          if(has("kindOther"))r.kind_other=o.kindOther||null;
    if(has("assignee"))r.assignee=o.assignee||null;
    if(has("subtasks"))r.subtasks=o.subtasks;
    r.updated_at=new Date().toISOString();
  }else if(coll==="columns"){
    if(has("projectId"))r.project_id=o.projectId; if(has("title"))r.title=o.title;
    if(has("order"))r.pos=o.order;                if(has("hue"))r.hue=o.hue||null;
  }else if(coll==="projects"){
    if(has("name"))r.name=o.name; if(has("order"))r.pos=o.order;
  }else if(coll==="members"){
    if(has("name"))r.name=o.name; if(has("color"))r.color=o.color;
  }else if(coll==="comments"){
    if(has("cardId"))r.card_id=o.cardId; if(has("author"))r.author=o.author;
    if(has("body"))r.body=o.body;
    if(has("createdAt"))r.created_at=new Date(o.createdAt).toISOString();
  }else if(coll==="files"){
    if(has("projectId"))r.project_id=o.projectId; if(has("cardId"))r.card_id=o.cardId||null;
    if(has("name"))r.name=o.name; if(has("size"))r.size=o.size;
    if(has("mime"))r.mime=o.mime; if(has("path"))r.path=o.path;
    if(has("createdAt"))r.created_at=new Date(o.createdAt).toISOString();
  }else{
    if(has("projectId"))r.project_id=o.projectId; if(has("body"))r.body=o.body;
    r.updated_at=new Date().toISOString();
  }
  if(id!=null) r.id=id;
  return r;
}
function supaStore(sb){
  var subs={},timers={};
  function refetch(coll){
    clearTimeout(timers[coll]);
    timers[coll]=setTimeout(function(){
      sb.from(TABLES[coll]).select("*").then(function(res){
        if(res.error){flash("Не удалось загрузить данные: "+res.error.message);return;}
        var rows=(res.data||[]).map(function(r){return fromRow(coll,r);});
        (subs[coll]||[]).forEach(function(f){f(rows);});
      });
    },110);
  }
  function done(coll){return function(res){refetch(coll);if(res&&res.error)throw res.error;};}
  return {
    kind:"supabase",refetch:refetch,sb:sb,
    subscribe:function(coll,cb){(subs[coll]=subs[coll]||[]).push(cb);refetch(coll);
      return function(){subs[coll]=subs[coll].filter(function(f){return f!==cb;});};},
    set:function(coll,id,body){return sb.from(TABLES[coll]).upsert(toRow(coll,id,body)).then(done(coll));},
    update:function(coll,id,patch){return sb.from(TABLES[coll]).update(toRow(coll,null,patch)).eq("id",id).then(done(coll));},
    del:function(coll,id){return sb.from(TABLES[coll]).delete().eq("id",id).then(done(coll));}
  };
}
function localStore(){
  var KEY="grid.board.v2",data=null;
  try{data=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  if(!data||!data.projects) data=starter();
  COLLS.forEach(function(c){if(!data[c])data[c]=[];});
  var subs={};
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(data));}
    catch(e){flash("В демо-режиме кончилось место в браузере. Удалите крупные файлы.");}
  }
  function emit(c){(subs[c]||[]).forEach(function(f){f(data[c].slice());});}
  function idx(c,id){for(var i=0;i<data[c].length;i++){if(data[c][i].id===id)return i;}return -1;}
  return {
    kind:"local",refetch:function(){},
    subscribe:function(c,cb){(subs[c]=subs[c]||[]).push(cb);
      setTimeout(function(){cb(data[c].slice());},0);
      return function(){subs[c]=subs[c].filter(function(f){return f!==cb;});};},
    set:function(c,id,body){var i=idx(c,id),rec=Object.assign({},body,{id:id});
      if(i<0)data[c].push(rec);else data[c][i]=rec;save();emit(c);return Promise.resolve();},
    update:function(c,id,patch){var i=idx(c,id);if(i<0)return Promise.resolve();
      data[c][i]=Object.assign({},data[c][i],patch);save();emit(c);return Promise.resolve();},
    del:function(c,id){data[c]=data[c].filter(function(d){return d.id!==id;});save();emit(c);return Promise.resolve();}
  };
}

function w(p){
  if(!p||!p.then) return p;
  return p.catch(function(e){
    var msg=(e&&(e.message||e.hint))||"";
    if(/row-level security|permission|denied|JWT/i.test(msg))
      flash("Нет прав на изменение. Возможно, сессия истекла — обновите страницу.");
    else if(/Failed to fetch|NetworkError/i.test(msg))
      flash("Нет связи с базой. Изменение не сохранено.");
    else flash("Не удалось сохранить"+(msg?": "+msg:"."));
  });
}

/* ═════════ порядок ═════════ */
function orderBetween(prev,next){
  if(prev==null&&next==null) return 1000;
  if(prev==null) return next-1000;
  if(next==null) return prev+1000;
  return (prev+next)/2;
}
function needsNormalize(a,b){return a!=null&&b!=null&&Math.abs(b-a)<0.0005;}
function normalize(list,coll){
  list.forEach(function(it,i){
    if(it.order!==(i+1)*1000) w(S.store.update(coll,it.id,{order:(i+1)*1000}));
  });
}

function patchCard(id,patch){
  var c=card(id); if(c) Object.assign(c,patch);
  w(S.store.update("cards",id,patch));
  renderMain(); if(S.open===id) renderDrawer();
}
/* Отметка «выполнено» переносит задачу на одну колонку вперёд.
   Снятие отметки задачу не возвращает — возврат был бы неожиданным. */
function toggleDone(id){
  var c=card(id); if(!c) return;
  var next=!c.done;
  var patch={done:next,status:next?"done":(c.status==="done"?"doing":c.status||"todo")};
  if(next){
    var list=cols(),i=-1;
    for(var k=0;k<list.length;k++){if(list[k].id===c.columnId){i=k;break;}}
    if(i>=0&&i<list.length-1){
      var target=list[i+1],tail=cardsIn(target.id);
      patch.columnId=target.id;
      patch.order=orderBetween(tail.length?tail[tail.length-1].order:null,null);
    }
  }
  patchCard(id,patch);
}

    desc:"",done:false,start:"",due:"",priority:"med",status:"todo",kind:"",kindOther:"",
    assignee:S.me||"",subtasks:[],updatedAt:Date.now()};

}

/* ═════════ файлы ═════════ */
var BUCKET="grid-files",DEMO_MAX=400*1024;
function pickFile(cardId){
  filePick.value="";
  filePick.onchange=function(){
    var f=filePick.files&&filePick.files[0]; if(f) uploadFile(f,cardId);
  };
  filePick.click();
}
function uploadFile(f,cardId){
  var id=uid("f");
  var meta={projectId:S.project,cardId:cardId||"",name:f.name,size:f.size,
    mime:f.type||"application/octet-stream",path:"",createdAt:Date.now()};
  if(S.store.kind==="supabase"){
    var path=S.project+"/"+id+"-"+f.name.replace(/[^\w.\-]+/g,"_");
    flash("Загружаем «"+f.name+"»…");
    S.store.sb.storage.from(BUCKET).upload(path,f,{contentType:meta.mime}).then(function(res){
      if(res.error){flash("Файл не загрузился: "+res.error.message);return;}
      meta.path=path;
      S.files.push(Object.assign({id:id},meta));
      w(S.store.set("files",id,meta));
      flash("Файл «"+f.name+"» прикреплён");
      renderDrawer(true); renderMain();
    });
  }else{
    if(f.size>DEMO_MAX){
      flash("В демо-режиме файл до "+fmtSize(DEMO_MAX)+". Подключите базу для больших файлов.");
      return;
    }
    var fr=new FileReader();
    fr.onload=function(){
      meta.data=fr.result;
      S.files.push(Object.assign({id:id},meta));
      w(S.store.set("files",id,meta));
      renderDrawer(true); renderMain();
    };
    fr.readAsDataURL(f);
  }
}
function openFile(f){
  if(S.store.kind==="supabase"&&f.path){
    S.store.sb.storage.from(BUCKET).createSignedUrl(f.path,120).then(function(res){
      if(res.error||!res.data){flash("Не удалось открыть файл: "+((res.error||{}).message||""));return;}
      window.open(res.data.signedUrl,"_blank","noopener");
    });
  }else if(f.data){
    var a=document.createElement("a");
    a.href=f.data; a.download=f.name; a.rel="noopener";
    document.body.appendChild(a); a.click(); a.remove();
  }else flash("Файл недоступен.");
}
function dropFile(f,quiet){
  if(!quiet&&!confirm("Удалить файл «"+f.name+"»?")) return;
  if(S.store.kind==="supabase"&&f.path){
    S.store.sb.storage.from(BUCKET).remove([f.path]).then(function(){},function(){});
  }
  S.files=S.files.filter(function(x){return x.id!==f.id;});
  w(S.store.del("files",f.id));
  if(!quiet){renderDrawer(true);renderMain();}
}

/* ═════════ диаграмма Ганта ═════════ */
function datedCards(){
  return projCards().filter(function(c){return c.due||c.start;}).filter(passes);
}
function renderGantt(){
  var list=datedCards();
  if(!list.length){
    mainEl.innerHTML='<div class="empty"><h2>Нечего показать на шкале</h2>'+
      "<p>Диаграмма строится по датам. Поставьте задаче дедлайн — и она появится здесь; добавьте дату начала, чтобы получилась полоса, а не точка.</p></div>";
    return;
  }
  var rows=list.map(function(c){
    var a=parseISO(c.start)||parseISO(c.due),b=parseISO(c.due)||parseISO(c.start);
    if(a>b){var t=a;a=b;b=t;}
    return {c:c,s:a,e:b};
  }).sort(function(x,y){return x.s-y.s||x.e-y.e;});
  var min=rows[0].s,max=rows[0].e;
  rows.forEach(function(r){if(r.s<min)min=r.s;if(r.e>max)max=r.e;});
  var today=parseISO(todayISO());
  if(today<min) min=today;
  if(today>max) max=today;
  min=new Date(min.getTime()-2*864e5); max=new Date(max.getTime()+2*864e5);
  var n=clamp(daysBetween(min,max)+1,1,180),days=[];
  for(var i=0;i<n;i++) days.push(new Date(min.getTime()+i*864e5));
  var tpl="grid-template-columns:230px repeat("+n+",34px)";

  var months="",mi=0;
  while(mi<days.length){
    var m=days[mi].getMonth(),span=0;
    while(mi+span<days.length&&days[mi+span].getMonth()===m) span++;
    months+='<div class="g-mon" style="grid-column:span '+span+'">'+
      MONTHS_FULL[m]+(days[mi].getFullYear()!==new Date().getFullYear()?" "+days[mi].getFullYear():"")+"</div>";
    mi+=span;
  }
  var head='<div class="g-row head" style="'+tpl+'"><div class="g-name">Задача</div>'+months+"</div>"+
    '<div class="g-row head" style="'+tpl+'"><div class="g-name"></div>'+
    days.map(function(d){
      var we=(d.getDay()===0||d.getDay()===6),td=(+d===+today);
      return '<div class="g-day'+(we?" we":"")+(td?" today":"")+'">'+d.getDate()+"<br>"+WEEK[d.getDay()]+"</div>";
    }).join("")+"</div>";

  var body=rows.map(function(r){
    var c=r.c,pr=c.priority||"med";
    var from=clamp(daysBetween(min,r.s),0,n-1),to=clamp(daysBetween(min,r.e),0,n-1);
    var span=Math.max(1,to-from+1);
    var cells=days.map(function(d){
      var we=(d.getDay()===0||d.getDay()===6),td=(+d===+today);
      return '<div class="g-cell'+(we?" we":"")+(td?" today":"")+'"></div>';}).join("");
    return '<div class="g-row" style="'+tpl+";--pc:"+prioVar(pr)+'" data-card="'+esc(c.id)+'">'+
      '<div class="g-name'+(c.done?" done":"")+'"><span class="dot"></span>'+esc(c.title)+"</div>"+cells+
      '<div class="g-bar'+(c.done?" done":"")+'" style="grid-column:'+(from+2)+" / span "+span+'">'+
      esc(c.title)+"</div></div>";
  }).join("");
  mainEl.innerHTML='<div class="pane"><div class="gantt">'+head+body+"</div></div>";
}

/* ═════════ календарь ═════════ */
function renderCalendar(){
  var list=projCards().filter(passes).filter(function(c){return c.due;});
  if(!list.length){
    mainEl.innerHTML='<div class="empty"><h2>Нет задач с датами</h2>'+
      "<p>Здесь задачи выстраиваются по дням. Поставьте дедлайн — и задача появится в этом списке.</p></div>";
    return;
  }
  var groups={};
  list.forEach(function(c){(groups[c.due]=groups[c.due]||[]).push(c);});
  var keys=Object.keys(groups).sort(),today=todayISO();
  mainEl.innerHTML='<div class="pane"><div class="cal">'+keys.map(function(k){
    var d=parseISO(k),td=(k===today);
    var late=(k<today&&groups[k].some(function(c){return !c.done;}));
    var when='<div class="cal-when'+(td?" today":late?" late":"")+'">'+
      '<div class="d">'+d.getDate()+"</div>"+
      '<div class="m">'+MONTHS_FULL[d.getMonth()]+", "+WEEK[d.getDay()]+"</div>"+
      (td?'<div class="m" style="color:var(--accent)">сегодня</div>'
        :late?'<div class="m" style="color:var(--danger)">просрочено</div>':"")+"</div>";
    var items=groups[k].sort(function(a,b){return (a.done?1:0)-(b.done?1:0);}).map(function(c){
      var col=column(c.columnId),as=c.assignee?member(c.assignee):null;
      return '<div class="cal-item'+(c.done?" done":"")+'" data-card="'+esc(c.id)+'" '+
        'style="--pc:'+prioVar(c.priority||"med")+'">'+
        '<span class="dot"></span><span class="t">'+esc(c.title)+"</span>"+
        (c.kind?'<span class="meta">'+esc(kindLabel(c))+"</span>":"")+
        '<span class="meta">'+esc(col?col.title:"")+"</span>"+
        (as?'<span class="av sm" style="background:'+esc(as.color)+'" title="'+esc(as.name)+'">'+esc(initials(as.name))+"</span>":"")+
        "</div>";}).join("");
    return '<section class="cal-day">'+when+'<div class="cal-list">'+items+"</div></section>";
  }).join("")+"</div></div>";
}

  setTimeout(function(){document.addEventListener("pointerdown",outside,true);},0);

}

/* ═════════ перетаскивание ═════════ */
var drag=null,autoRAF=null,dropAt=0;
function pointDown(e){
  if(S.tab!=="board") return;
  if(e.button!=null&&e.button!==0) return;
  if(e.target.closest("button,input,textarea,select,a")) return;
  var cardEl=e.target.closest("[data-card]"),headEl=e.target.closest("[data-colhead]");
  var el=cardEl||headEl; if(!el) return;
  drag={kind:cardEl?"card":"col",id:cardEl?cardEl.dataset.card:headEl.dataset.colhead,
    x0:e.clientX,y0:e.clientY,started:false,host:cardEl||el.closest("[data-col]")};
  window.addEventListener("pointermove",pointMove);
  window.addEventListener("pointerup",pointUp);
  window.addEventListener("pointercancel",pointUp);
}
function startDrag(){
  var host=drag.host,r=host.getBoundingClientRect();
  drag.started=true; S.dragging=true; closeSheet();
  drag.dx=drag.x0-r.left; drag.dy=drag.y0-r.top;
  var g=host.cloneNode(true);
  g.className=host.className.replace(/\bdrag-src\b/,"")+" drag-ghost"+(drag.kind==="col"?" col":"");
  g.style.cssText+=";width:"+r.width+"px;left:"+r.left+"px;top:"+r.top+"px;margin:0";
  if(drag.kind==="col") g.style.maxHeight=r.height+"px";
  document.body.appendChild(g); drag.ghost=g;
  var slot=document.createElement("div");
  slot.className="slot"+(drag.kind==="col"?" col":"");
  slot.style.height=r.height+"px";
  if(drag.kind==="col") slot.style.width=r.width+"px";
  drag.slot=slot;
  host.classList.add("drag-src");
  host.parentNode.insertBefore(slot,host);
  host.style.display="none";
  document.body.style.cursor="grabbing";
  autoRAF=requestAnimationFrame(autoScroll);
}
function autoScroll(){
  if(!drag||!drag.started) return;
  var b=$("#board");
  if(b){
    var r=b.getBoundingClientRect(),x=drag.lastX||0;
    if(x&&x<r.left+70) b.scrollLeft-=14; else if(x&&x>r.right-70) b.scrollLeft+=14;
  }
  if(drag.kind==="card"&&drag.overBody){
    var br=drag.overBody.getBoundingClientRect(),y=drag.lastY||0;
    if(y<br.top+40) drag.overBody.scrollTop-=10;
    else if(y>br.bottom-40) drag.overBody.scrollTop+=10;
  }
  autoRAF=requestAnimationFrame(autoScroll);
}
function pointMove(e){
  if(!drag) return;
  if(!drag.started){
    if(Math.abs(e.clientX-drag.x0)<5&&Math.abs(e.clientY-drag.y0)<5) return;
    startDrag();
  }
  e.preventDefault();
  drag.lastX=e.clientX; drag.lastY=e.clientY;
  drag.ghost.style.left=(e.clientX-drag.dx)+"px";
  drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  if(drag.kind==="card") placeCardSlot(e.clientX,e.clientY); else placeColSlot(e.clientX);
}
function placeCardSlot(x,y){
  var bodies=$$("[data-body]"); if(!bodies.length) return;
  var target=null,best=Infinity;
  bodies.forEach(function(b){
    var r=b.parentNode.getBoundingClientRect();
    if(x>=r.left&&x<=r.right){target=b;best=-1;return;}
    if(best!==-1){var d=x<r.left?r.left-x:x-r.right;if(d<best){best=d;target=b;}}
  });
  if(!target) return;
  drag.overBody=target;
  $$(".track-body.hot").forEach(function(b){b.classList.remove("hot");});
  target.classList.add("hot");
  var cards=$$("[data-card]",target),before=null;
  for(var i=0;i<cards.length;i++){
    var r=cards[i].getBoundingClientRect();
    if(r.height&&y<r.top+r.height/2){before=cards[i];break;}
  }
  if(!before) before=$(".composer",target)||$(".add-card",target);
  if(before) target.insertBefore(drag.slot,before); else target.appendChild(drag.slot);
}
function placeColSlot(x){
  var b=$("#board"); if(!b) return;
  var tracks=$$("[data-col]",b).filter(function(t){return t.style.display!=="none";});
  var before=null;
  for(var i=0;i<tracks.length;i++){
    var r=tracks[i].getBoundingClientRect();
    if(x<r.left+r.width/2){before=tracks[i];break;}
  }
  if(!before) before=$(".add-track",b);
  if(before) b.insertBefore(drag.slot,before); else b.appendChild(drag.slot);
}
function pointUp(){
  window.removeEventListener("pointermove",pointMove);
  window.removeEventListener("pointerup",pointUp);
  window.removeEventListener("pointercancel",pointUp);
  if(!drag) return;
  if(!drag.started){drag=null;return;}
  cancelAnimationFrame(autoRAF);
  document.body.style.cursor="";
  var d=drag; drag=null; S.dragging=false; dropAt=Date.now();
  if(d.ghost) d.ghost.remove();
  $$(".track-body.hot").forEach(function(b){b.classList.remove("hot");});
  if(d.kind==="card") commitCardDrop(d); else commitColDrop(d);
  if(d.slot) d.slot.remove();
  d.host.style.display=""; d.host.classList.remove("drag-src");
  renderMain();
}
function neighbours(slot,sel,attr){
  var prev=slot.previousElementSibling,next=slot.nextElementSibling;
  while(prev&&!prev.matches(sel)) prev=prev.previousElementSibling;
  while(next&&!next.matches(sel)) next=next.nextElementSibling;
  return {prev:prev?prev.getAttribute(attr):null,next:next?next.getAttribute(attr):null};
}
function commitCardDrop(d){
  var body=d.slot.closest("[data-body]"); if(!body) return;
  var colId=body.dataset.body;
  var nb=neighbours(d.slot,"[data-card]","data-card");
  var pc=nb.prev?card(nb.prev):null,nc=nb.next?card(nb.next):null;
  var po=pc?pc.order:null,no=nc?nc.order:null;
  var c=card(d.id); if(!c) return;
  if(c.columnId===colId&&po===null&&no===null&&cardsIn(colId).length===1) return;
  patchCard(d.id,{columnId:colId,order:orderBetween(po,no)});
  if(needsNormalize(po,no)) normalize(cardsIn(colId),"cards");
}
function commitColDrop(d){
  var nb=neighbours(d.slot,"[data-col]","data-col");
  var pc=nb.prev?column(nb.prev):null,nc=nb.next?column(nb.next):null;
  var po=pc?pc.order:null,no=nc?nc.order:null;
  var col=column(d.id); if(!col) return;
  var order=orderBetween(po,no);
  col.order=order; w(S.store.update("columns",d.id,{order:order}));
  if(needsNormalize(po,no)) normalize(cols(),"columns");
}

$("#btnProjects").addEventListener("click",function(e){openSheet(e.currentTarget,projectsHTML(),wireProjects);});
$("#btnMembers").addEventListener("click",function(e){
  openSheet(e.currentTarget,membersHTML(false),function(el){wireMembers(el,false);});});
$("#btnMe").addEventListener("click",function(e){
  openSheet(e.currentTarget,membersHTML(true),function(el){wireMembers(el,true);});});
$("#boardTitle").addEventListener("click",function(e){
  var btn=e.currentTarget,p=project(); if(!p) return;
  var inp=document.createElement("input");
  inp.className="b-title-in"; inp.value=p.name;
  btn.replaceWith(inp); inp.focus(); inp.select();
  var fired=false;
  function finish(){
    if(fired) return; fired=true;
    var v=inp.value.trim()||p.name;
    inp.replaceWith(btn); btn.textContent=v;
    if(v!==p.name){p.name=v;w(S.store.update("projects",p.id,{name:v}));}
    renderAll();
  }
  inp.addEventListener("blur",finish);
  inp.addEventListener("keydown",function(ev){
    if(ev.key==="Enter")inp.blur();
    if(ev.key==="Escape"){inp.value=p.name;inp.blur();}});
});

/* ═════════ присутствие ═════════ */
var MYKEY=Math.random().toString(36).slice(2)+Date.now().toString(36);
function pushPresence(){
  if(!S.chan) return;
  var m=S.me?member(S.me):null;
  try{S.chan.track({key:MYKEY,who:m?String(m.name).slice(0,40):"Гость",
    tint:m?m.color:"#7F8C8D"});}catch(e){}
}
function wireRealtime(sb,store){
  var ch=sb.channel("grid-board");
  COLLS.forEach(function(coll){
    ch.on("postgres_changes",{event:"*",schema:"public",table:TABLES[coll]},
      function(){store.refetch(coll);});
  });
  ch.on("presence",{event:"sync"},function(){
    var st=ch.presenceState(),list=[];
    Object.keys(st).forEach(function(k){(st[k]||[]).forEach(function(p){
      list.push({kind:"viewer",isMe:p.key===MYKEY,
        presence:{who:typeof p.who==="string"?p.who:"Гость",tint:p.tint}});});});
    S.peers=list; renderPresence();
  });
  ch.subscribe(function(status){if(status==="SUBSCRIBED"){S.chan=ch;pushPresence();}});
  setInterval(pushPresence,45000);
}

/* ═════════ запуск ═════════ */
function attach(store){
  S.store=store; S.mode=store.kind;
  COLLS.forEach(function(coll){
    store.subscribe(coll,function(rows){
      S[coll]=rows;
      if(coll==="members"&&S.me&&!member(S.me)){
        S.me=null;try{localStorage.removeItem("grid.me");}catch(e){}}
      if(coll==="projects"&&(!S.project||!project())){
        var sorted=rows.slice().sort(byOrder);
        S.project=sorted.length?sorted[0].id:null;
      }
      renderMain();
      if(S.open) renderDrawer();
      if(coll==="members") pushPresence();
    });
  });
  if(store.kind==="local"){
    var notice=$("#notice");
    notice.hidden=false;
    notice.innerHTML='<b>Демо-режим.</b> Задачи хранятся только в этом браузере, и коллеги их не видят. Чтобы работать командой, подключите базу Supabase.';
  }
}
try{S.me=localStorage.getItem("grid.me")||null;}catch(e){}
try{S.project=localStorage.getItem("grid.project")||null;}catch(e){}
renderRail(); renderTabs();

var CFG=(window.GRID_CONFIG&&window.GRID_CONFIG.url)?window.GRID_CONFIG:null;
if(!CFG){try{var raw=localStorage.getItem("grid.cfg");
  if(raw){var o=JSON.parse(raw);if(o&&o.url&&o.anonKey)CFG=o;}}catch(e){}}
var AUTH=(CFG&&CFG.auth)||"google";

function hideGate(){gateEl.hidden=true;gateEl.innerHTML="";}
function showGate(html,wire){
  gateEl.hidden=false;
  gateEl.innerHTML='<div class="gate-box">'+html+"</div>";
  if(wire) wire(gateEl);
}
function demoMode(){hideGate();attach(localStore());}
function setupScreen(msg){
  showGate('<div class="gate-mark">Grid</div><h1>Подключите базу</h1>'+
    "<p>Доски хранятся в Supabase. Вставьте адрес проекта и публичный ключ <code>anon</code> — они лежат в Supabase в разделе Project&nbsp;Settings → API.</p>"+
    (msg?'<div class="msg bad">'+esc(msg)+"</div>":"")+
    '<div class="fld"><label for="gu">Project URL</label><input id="gu" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false"></div>'+
    '<div class="fld"><label for="gk">Anon key</label><input id="gk" placeholder="eyJhbGciOi…" autocomplete="off" spellcheck="false"></div>'+
    '<button class="btn" id="gsave">Подключить</button>'+
    '<button class="btn ghost" id="gdemo">Сначала посмотреть демо</button>'+
    '<p class="small">Ключ <code>anon</code> не секретный — он рассчитан на работу в браузере. Данные защищает вход и правила доступа на стороне базы.</p>',
  function(el){
    $("#gsave",el).addEventListener("click",function(){
      var u=$("#gu",el).value.trim().replace(/\/+$/,""),k=$("#gk",el).value.trim();
      if(!/^https:\/\/[^ ]+$/.test(u)||!k){
        setupScreen("Проверьте адрес проекта и ключ — одно из полей пустое или заполнено неверно.");return;}
      try{localStorage.setItem("grid.cfg",JSON.stringify({url:u,anonKey:k,auth:AUTH}));}catch(e){}
      location.reload();
    });
    $("#gdemo",el).addEventListener("click",demoMode);
  });
}
function signInScreen(sb,msg,kind){
  var provider=(AUTH==="github")?"github":"google";
  var pname=(provider==="github")?"GitHub":"Google";
  var body='<div class="gate-mark">Grid</div><h1>Вход на доску</h1>'+
    "<p>Доски общие для команды — войдите, чтобы видеть задачи и сохранять изменения.</p>"+
    (msg?'<div class="msg '+(kind||"bad")+'">'+esc(msg)+"</div>":"");
  if(AUTH==="email"){
    body+='<div class="fld"><label for="gm">Рабочая почта</label>'+
      '<input id="gm" type="email" placeholder="you@company.com" autocomplete="email"></div>'+
      '<button class="btn" id="gmail">Прислать ссылку для входа</button>';
  }else body+='<button class="btn" id="goauth">Войти через '+pname+"</button>";
  body+='<button class="btn ghost" id="gdemo">Посмотреть демо без входа</button>';
  showGate(body,function(el){
    $("#gdemo",el).addEventListener("click",demoMode);
    var o=$("#goauth",el);
    if(o) o.addEventListener("click",function(){
      o.disabled=true; o.textContent="Открываем "+pname+"…";
      sb.auth.signInWithOAuth({provider:provider,
        options:{redirectTo:location.origin+location.pathname}})
        .then(function(r){if(r&&r.error) signInScreen(sb,r.error.message);});
    });
    var m=$("#gmail",el);
    if(m) m.addEventListener("click",function(){
      var email=($("#gm",el).value||"").trim();
      if(!/.+@.+\..+/.test(email)){signInScreen(sb,"Введите корректный адрес почты.");return;}
      m.disabled=true; m.textContent="Отправляем…";
      sb.auth.signInWithOtp({email:email,options:{emailRedirectTo:location.origin+location.pathname}})
        .then(function(r){
          if(r&&r.error) signInScreen(sb,r.error.message);
          else signInScreen(sb,"Письмо отправлено на "+email+". Откройте ссылку из него — можно на любом устройстве.","ok");});
    });
  });
}
function start(sb){
  if(S.started) return; S.started=true;
  hideGate();
  var st=supaStore(sb);
  attach(st); wireRealtime(sb,st);
}
(function boot(){
  if(!CFG){setupScreen();return;}
  if(!window.supabase||!window.supabase.createClient){
    showGate('<div class="gate-mark">Grid</div><h1>Библиотека не загрузилась</h1>'+
      "<p>Не удалось получить supabase-js с CDN. Проверьте соединение и обновите страницу.</p>"+
      '<button class="btn ghost" id="gdemo">Посмотреть демо</button>',
      function(el){$("#gdemo",el).addEventListener("click",demoMode);});
    return;
  }
  var sb;
  try{sb=window.supabase.createClient(CFG.url,CFG.anonKey);}
  catch(e){setupScreen("Не удалось подключиться: "+((e&&e.message)||"проверьте адрес и ключ."));return;}
  S.sb=sb;
  sb.auth.onAuthStateChange(function(ev,session){
    if(session&&!S.started) start(sb);
    else if(ev==="SIGNED_OUT") location.reload();
  });
  sb.auth.getSession().then(function(r){
    if(r&&r.data&&r.data.session) start(sb); else signInScreen(sb);
  }).catch(function(){signInScreen(sb);});
})();
})();
</script>
